{% assign r = site.data.release %}
<p class="counter">
  {% unless include.short %}Version {{ r.version }}{% if r.released %} · <time datetime="{{ r.released }}">{{ r.released | date: "%-d %B %Y" }}</time>{% endif %} · {% endunless %}Downloads: <span id="count" data-counts='{{ site.data.counts | jsonify }}'>{{ site.data.counts.sum }}</span>
</p>
<script>
(function () {
  var el = document.getElementById("count"), counts = JSON.parse(el.dataset.counts);
  if (!counts) return;
  var ext = { linux: ".run", windows: ".exe", macos: ".dmg" }, known = counts.total;
  var day = 864e5, knownKey = "finterm-downloads-known", clickKey = "finterm-downloads-clicked";

  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function store(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function clicks() { return clicked.filter(function (c) { return Date.now() - c.at < day; }); }

  // GitHub's count lags a download. A click here counts until GitHub's has risen
  // by it, for a day at most.
  function shown(os) {
    var mine = clicks().filter(function (c) { return c.os === os; });
    return mine.length ? Math.max(known[os], mine[0].known + mine.length) : known[os];
  }
  function render() {
    var sum = 0;
    Object.keys(ext).forEach(function (os) {
      var n = shown(os), tile = document.getElementById("count-" + os);
      sum += n;
      if (tile) tile.textContent = n.toLocaleString("en") + (n === 1 ? " download" : " downloads");
    });
    el.textContent = sum.toLocaleString("en");
  }
  function raise(n) {
    var rose = false;
    Object.keys(ext).forEach(function (os) { if (n[os] > known[os]) { known[os] = n[os]; rose = true; } });
    return rose;
  }
  function refresh() {
    fetch("https://api.github.com/repos/yumima/finterm/releases?per_page=100")
      .then(function (x) { if (!x.ok) throw x.status; return x.json(); })
      .then(function (releases) {
        var n = Object.assign({}, counts.kept);
        releases.forEach(function (rel) {
          if (counts.kept_tags.indexOf(rel.tag_name) >= 0) return;
          rel.assets.forEach(function (a) {
            Object.keys(ext).forEach(function (os) { if (a.name.endsWith("-setup" + ext[os])) n[os] += a.download_count; });
          });
        });
        if (raise(n)) { store(knownKey, { at: Date.now(), n: known }); render(); }
      }).catch(function () {});
  }

  var last = load(knownKey), clicked = load(clickKey) || [];
  if (last && Date.now() - last.at < day) raise(last.n);
  render();
  refresh();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  Object.keys(ext).forEach(function (os) {
    var tile = document.getElementById("count-" + os), link = tile && tile.parentNode.querySelector("a");
    if (link) link.addEventListener("click", function () {
      clicked = clicks().concat({ os: os, at: Date.now(), known: known[os] });
      store(clickKey, clicked);
      render();
    });
  });
})();
</script>
