title: finterm
tagline: Comprehensive financial research terminal
description: >-
  Comprehensive, Bloomberg-style financial research terminal that runs on your own
  computer: equity research, SEC filings, futures, IPO pipeline, portfolio,
  quant experiments, strategy building. Free and
  open source, for Linux, Windows and macOS. Publishes a
  one-page weekly brief: markets, economy, insider and fund moves, screen leaders.
url: https://yumima.github.io
baseurl: /finterm
lang: en
timezone: UTC
future: true

repo_url: https://github.com/yumima/finterm
download_url: https://yumima.github.io/finterm/download/
install_url: https://github.com/yumima/finterm#install
# The tabs to the other projects; "" = none. Set to /hearth/ once that site and
# yumima.github.io are published, or the tabs lead nowhere.
hearth_url: /hearth/

permalink: /brief/:year-:month-:day/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml
  posts_limit: 30

# Theme briefs (Social › BRIEFS): their own collection, so the weekly
# archive, the home page's latest issue and feed.xml stay weekly issues.
collections:
  themes:
    output: true
    permalink: /themes/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: themes }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
