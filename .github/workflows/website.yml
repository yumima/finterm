# Builds and deploys the website (site/) to GitHub Pages.
#
# The weekly issue itself is written and announced on the owner's machine
# (tools/weekly_publish.sh, on a systemd user timer): the SEC contact and the
# X keys stay in the local keyring and are never uploaded. Pushing the issue
# under site/ is what triggers this deploy. No secrets are used here.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/scripts/site_counts.py", ".github/scripts/keep_download_counts.py", ".github/workflows/website.yml"]
  schedule:
    - cron: "17 6 * * *"  # the download counts in the pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, and the deploy tries again: deploy-pages asks once which artifacts
# this run has, and GitHub can take a moment to list a finished upload. Within a
# second of it the answer was none, twice (runs 45283013178, 45318786139). Only
# deploy-pages' own (internal) listing matters, so the retry is the check. The
# upload is its own job so that re-running a failed deploy does not upload a
# second copy, which deploy-pages refuses.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wait in 5 15 45 0; do
            ok=1
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[]' > /tmp/releases.jsonl && break
            ok=0
            sleep "${wait}"
          done
          [ "${ok}" -eq 1 ] || { echo "::error::no release list from GitHub"; exit 1; }
          jq -s . /tmp/releases.jsonl > /tmp/releases.json
          python3 .github/scripts/site_counts.py site/_data/downloads.json /tmp/releases.json site/_data/counts.json
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./site, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
      - if: steps.try1.outcome == 'failure'
        run: sleep 20
      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
      - if: steps.try2.outcome == 'failure'
        run: sleep 60
      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
