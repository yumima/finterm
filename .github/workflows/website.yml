# Builds and deploys the website (site/) to GitHub Pages.
#
# The weekly issue itself is written and announced on the owner's machine
# (tools/weekly_publish.sh, on a systemd user timer): the SEC contact and the
# X keys stay in the local keyring and are never uploaded. Pushing the issue
# under site/ is what triggers this deploy. No secrets are used here.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./site, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
