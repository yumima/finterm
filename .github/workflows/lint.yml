name: Lint

on:
  # Manual-only — lint never runs automatically on push/tag/PR.
  # Trigger from the Actions tab via "Run workflow".
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── clang-format ─────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Check formatting
        working-directory: app
        run: |
          # Parentheses required: without them -o has lower precedence than the
          # implicit -print, so only .h files get piped to xargs.
          find src \( -name "*.cpp" -o -name "*.h" \) | sort | \
            xargs clang-format --style=file --dry-run --Werror
          echo "All files are correctly formatted."

  # ── clang-tidy ───────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-18 clang-tidy-18 \
            cmake ninja-build \
            qt6-base-dev qt6-base-private-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            qt6-charts-dev \
            qt6-multimedia-dev libqt6multimediawidgets6 \
            libqt6svg6-dev \
            libqt6sql6-dev libqt6websockets6-dev \
            libqt6concurrent6-dev libqt6printsupport6-dev \
            libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Configure (generate compile_commands.json)
        working-directory: app
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFINTERM_BUILD_INSTALLER=OFF \
            -DDEPLOY_QT=OFF

      - name: Run clang-tidy
        working-directory: app
        run: |
          find src -name "*.cpp" | grep -v "/moc_" | grep -v "/qrc_" | sort | \
            xargs clang-tidy \
              --config-file=.clang-tidy \
              -p build \
              --extra-arg=-std=c++20 \
              2>&1
          echo "clang-tidy complete."

  # ── datahub-discipline ───────────────────────────────────────────────────────
  # Enforces DataHub rules D1 and D4 (see app/DATAHUB_ARCHITECTURE.md §4.1) over
  # src/screens AND src/ui:
  #   D1 — screens and UI never reach the Python runner or the daemon: no
  #        PythonRunner::instance() / PythonWorker::instance() at all (run,
  #        run_interactive, run_code, submit, and a reference kept to call
  #        them later). Their owning service runs the script.
  #   D4 — consumers never call a streaming service's fetch_* API when the
  #        data has a hub topic; only the one-shot owner reads listed below.
  # There is no opt-out comment: a new one-shot read without a topic goes on
  # the allowlist, in review, with its reason.
  # Calls are found across a line break (clang-format splits `X::instance()`
  # from `.fetch_y(` past 120 columns) and through a reference to the
  # service (`auto& mds = MarketDataService::instance(); mds.fetch_quotes(`).
  # If this step fails, route the offending code through its owner and
  # DataHub. See app/DATAHUB_ARCHITECTURE.md §4.1 for the producer + topic you
  # should be using instead.
  datahub-discipline:
    name: datahub-discipline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check screens/ and ui/ do not reach Python directly
        working-directory: app
        run: |
          # Prints `file:line: <match>` per use.
          violations=$(find src/screens src/ui \( -name '*.cpp' -o -name '*.h' \) -print0 | sort -z | \
            xargs -0 perl -0ne 'while (/\b(?:PythonRunner|PythonWorker)\s*::\s*instance\s*\(\s*\)/g) {
                my $ln = 1 + (substr($_, 0, $-[0]) =~ tr/\n//); print "$ARGV:$ln: $&\n" }' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D1 violation — screens and UI must not run Python or call the daemon."
            echo "Route through the service that owns the data (or a Producer registered with DataHub)."
            echo "See app/DATAHUB_ARCHITECTURE.md §4.1."
            exit 1
          fi
          echo "D1 — screens and ui are clean."

      - name: Check screens/ and ui/ do not call streaming service fetch_* APIs
        working-directory: app
        run: |
          # The allowlist: one-shot owner reads whose data has NO hub topic.
          #   MarketDataService — bars (a chart's own load, needs its ok flag
          #     and supersession), info / info_raw, company profiles, IPO
          #     extras, news, SEC filings, S-1 funding, Wikipedia, orderbook
          #     (no producer), CBOE option chain, Yahoo option IV surface.
          #   DBnomicsService — providers / datasets / series / observations.
          #   EconomicsService — the Treasury par curve.
          #   NewsService — fetch_all_news_progressive: the News screen's own
          #     refresh with per-feed progress; news:general carries only the
          #     merged result.
          # Never here: quotes, sparklines, history, movers — they have topics
          # (market:quote / sparkline / history / movers): subscribe.
          violations=$(find src/screens src/ui \( -name '*.cpp' -o -name '*.h' \) -print0 | sort -z | \
            xargs -0 perl -0ne '
              BEGIN {
                %allow = map { $_ => 1 } qw(
                  MarketDataService::fetch_bars MarketDataService::fetch_company_profiles
                  MarketDataService::fetch_info MarketDataService::fetch_info_raw
                  MarketDataService::fetch_ipo_extras MarketDataService::fetch_news
                  MarketDataService::fetch_options_chain MarketDataService::fetch_options_surface
                  MarketDataService::fetch_orderbook MarketDataService::fetch_s1_funding
                  MarketDataService::fetch_sec_filings MarketDataService::fetch_sec_filings_of_form
                  MarketDataService::fetch_wikipedia_summary
                  DBnomicsService::fetch_providers DBnomicsService::fetch_datasets
                  DBnomicsService::fetch_series DBnomicsService::fetch_observations
                  EconomicsService::fetch_treasury_par_curve
                  NewsService::fetch_all_news_progressive
                );
              }
              my $svc = qr/(MarketDataService|NewsService|EconomicsService|DBnomicsService|GovDataService)/;
              my @hits;
              # Svc::instance().fetch_x / ->fetch_x, across line breaks.
              while (/\b$svc\s*::\s*instance\s*\(\s*\)\s*(?:\.|->)\s*(fetch_\w+)/g) {
                push @hits, [$-[0], "$1::$2"];
              }
              # A name bound to the service (auto& s = Svc::instance(); auto* s = &...).
              my %alias;
              while (/\b(\w+)\s*=\s*&?\s*(?:\w+\s*::\s*)*$svc\s*::\s*instance\s*\(\s*\)/g) { $alias{$1} = $2; }
              for my $v (keys %alias) {
                while (/(?<![\w.>])\Q$v\E\s*(?:\.|->)\s*(fetch_\w+)/g) { push @hits, [$-[0], "$alias{$v}::$1"]; }
              }
              for my $h (sort { $a->[0] <=> $b->[0] } @hits) {
                next if $allow{$h->[1]};
                my $ln = 1 + (substr($_, 0, $h->[0]) =~ tr/\n//);
                print "$ARGV:$ln: $h->[1]\n";
              }' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D4 violation — consumers must not call streaming fetch_* APIs."
            echo "Use DataHub::subscribe() for live data, DataHub::peek() for snapshots."
            echo "See app/DATAHUB_ARCHITECTURE.md §4.1."
            exit 1
          fi
          echo "D4 — screens and ui are clean."

  # ── cppcheck ─────────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        working-directory: app
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --inline-suppr \
            --std=c++20 \
            --error-exitcode=1 \
            -I src \
            -j "$(nproc)" \
            src 2>&1
          echo "cppcheck complete."
