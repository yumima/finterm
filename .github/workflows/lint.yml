name: Lint

on:
  # Manual-only — lint never runs automatically on push/tag/PR.
  # Trigger from the Actions tab via "Run workflow".
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── clang-format ─────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Check formatting
        working-directory: fincept-qt
        run: |
          # Parentheses required: without them -o has lower precedence than the
          # implicit -print, so only .h files get piped to xargs.
          find src \( -name "*.cpp" -o -name "*.h" \) | sort | \
            xargs clang-format --style=file --dry-run --Werror
          echo "All files are correctly formatted."

  # ── clang-tidy ───────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-18 clang-tidy-18 \
            cmake ninja-build \
            qt6-base-dev qt6-base-private-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            qt6-charts-dev \
            qt6-multimedia-dev libqt6multimediawidgets6 \
            libqt6svg6-dev \
            libqt6sql6-dev libqt6websockets6-dev \
            libqt6concurrent6-dev libqt6printsupport6-dev \
            libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Configure (generate compile_commands.json)
        working-directory: fincept-qt
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFINCEPT_BUILD_INSTALLER=OFF \
            -DDEPLOY_QT=OFF

      - name: Run clang-tidy
        working-directory: fincept-qt
        run: |
          find src -name "*.cpp" | grep -v "/moc_" | grep -v "/qrc_" | sort | \
            xargs clang-tidy \
              --config-file=.clang-tidy \
              -p build \
              --extra-arg=-std=c++20 \
              2>&1
          echo "clang-tidy complete."

  # ── datahub-discipline ───────────────────────────────────────────────────────
  # Enforces DataHub rules D1 and D4 (see fincept-qt/DATAHUB_ARCHITECTURE.md §4):
  #   D1 — screens must not spawn Python directly.
  #   D4 — consumers must not call service fetch_* callbacks.
  # A call site may opt out with `// D1-exempt: <reason>` / `// D4-exempt:
  # <reason>` trailing the line that opens the call (the reason is required).
  # Calls are found across a line break, because clang-format splits
  # `X::instance()` from `.fetch_y(` once the line passes 120 columns — a
  # line-based grep never saw those calls at all.
  # If this step fails, route the offending code through DataHub. See
  # fincept-qt/DATAHUB_ARCHITECTURE.md §4 for the producer + topic you should
  # be using instead.
  datahub-discipline:
    name: datahub-discipline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check screens/ does not call PythonRunner directly
        working-directory: fincept-qt
        run: |
          # Prints `file:line: <call>(<rest of that line>)` per call site.
          violations=$(find src/screens \( -name '*.cpp' -o -name '*.h' \) -print0 | sort -z | \
            xargs -0 perl -0ne 'while (/PythonRunner::instance\(\)\s*\.\s*run\([^\n]*/g) {
                my $ln = 1 + (substr($_, 0, $-[0]) =~ tr/\n//); print "$ARGV:$ln: $&\n" }' \
            | grep -vE '// D1-exempt: *[^ ]' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D1 violation — screens must not call PythonRunner directly."
            echo "Route through a Producer registered with DataHub."
            echo "See fincept-qt/DATAHUB_ARCHITECTURE.md §4."
            exit 1
          fi
          echo "D1 — screens are clean."

      - name: Check screens/ does not call deprecated service fetch_* APIs
        working-directory: fincept-qt
        run: |
          # D4 exempts one-shot lookups that have no hub topic:
          #   MarketDataService::fetch_info / fetch_news / fetch_company_profiles /
          #   fetch_ipo_extras / fetch_sec_filings / fetch_s1_funding /
          #   fetch_wikipedia_summary,
          #   DBnomicsService::fetch_providers / fetch_datasets / fetch_series /
          #   fetch_observations.
          # Anything else — an API with a topic (quote/sparkline/history) called
          # one-shot for its ok flag, or a polled API with no producer yet
          # (top_movers, orderbook) — needs a `// D4-exempt: <reason>`.
          # Match every fetch_* call, then grep -v the allowed ones.
          violations=$(find src/screens \( -name '*.cpp' -o -name '*.h' \) -print0 | sort -z | \
            xargs -0 perl -0ne 'while (/(MarketDataService|NewsService|EconomicsService|DBnomicsService|GovDataService)::instance\(\)\s*\.\s*fetch_[^\n]*/g) {
                my $ln = 1 + (substr($_, 0, $-[0]) =~ tr/\n//); (my $m = $&) =~ s/\(\)\s*\.\s*/()./; print "$ARGV:$ln: $m\n" }' \
            | grep -vE 'MarketDataService::instance\(\)\.fetch_(info|news|company_profiles|ipo_extras|sec_filings|s1_funding|wikipedia_summary)\b' \
            | grep -vE 'DBnomicsService::instance\(\)\.fetch_(providers|datasets|series|observations)\b' \
            | grep -vE '// D4-exempt: *[^ ]' \
            || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D4 violation — consumers must not call streaming fetch_* APIs."
            echo "Use DataHub::subscribe() for live data, DataHub::peek() for snapshots."
            echo "See fincept-qt/DATAHUB_ARCHITECTURE.md §4."
            exit 1
          fi
          echo "D4 — screens are clean."

  # ── cppcheck ─────────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        working-directory: fincept-qt
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --inline-suppr \
            --std=c++20 \
            --error-exitcode=1 \
            -I src \
            -j "$(nproc)" \
            src 2>&1
          echo "cppcheck complete."
