name: Release — Build All Installers

# ─────────────────────────────────────────────────────────────────────────────
# Triggered on:
#   • git tag push  (v*)  → builds installers, creates GH Release, updates README
#   • workflow_dispatch   → manual run (skips release + README update)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'
    # A branch named ci/… builds all three installers and runs the Windows
    # install + self-test WITHOUT publishing (the release jobs need a tag):
    # the way to check a packaging change before tagging it.
    branches:
      - 'ci/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia"
  QT_IFW_VERSION: "4.7"
  QT_IFW_TOOL: "tools_ifw"
  APP_NAME: finterm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 — Windows x64 Installer (QtIFW .exe)
# ═════════════════════════════════════════════════════════════════════════════
jobs:
  # ctest on Windows, macOS, Linux (tests.yml). Runs beside the builds; the
  # release job does not publish unless it passed.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build-windows:
    name: Windows x64 Installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ── OpenSSL dev libs ──────────────────────────────────────────────────
      - name: Install OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          "$VCPKG_ROOT/vcpkg" install openssl:x64-windows --no-print-usage
          OPENSSL_DIR="$VCPKG_ROOT/installed/x64-windows"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_DIR" >> "$GITHUB_ENV"
          ls "$OPENSSL_DIR/lib/libcrypto.lib" && echo "libcrypto.lib confirmed"

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-windows-x64-release

      # ── Qt Installer Framework ────────────────────────────────────────────
      - name: Install Qt Installer Framework
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-tool windows desktop ${{ env.QT_IFW_TOOL }} \
            --outputdir "${{ runner.temp }}/qtifw"
          IFW_DIR="${{ runner.temp }}/qtifw/Tools/QtInstallerFramework/${{ env.QT_IFW_VERSION }}"
          echo "QT_IFW_DIR=${IFW_DIR}" >> "$GITHUB_ENV"
          echo "PATH=${IFW_DIR}/bin:${PATH}" >> "$GITHUB_ENV"

      # ── Configure + Build ─────────────────────────────────────────────────
      - name: Configure CMake
        shell: bash
        working-directory: app
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFINTERM_QT_STRICT=ON \
            -DFINTERM_RELEASE_BUILD=ON \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DDEPLOY_QT=ON \
            -DFINTERM_BUILD_INSTALLER=ON

      - name: Build
        shell: bash
        working-directory: app
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        shell: bash
        working-directory: app
        run: |
          BINARY="build/Release/${{ env.APP_NAME }}.exe"
          [ -f "$BINARY" ] || { echo "::error::Binary not found"; exit 1; }
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"

      # ── Deploy Qt DLLs ────────────────────────────────────────────────────
      # Mirrors the matrix build in build-cpp.yml — both must stage the SAME
      # set of DLLs, plugins, and resources or the installer ships a broken
      # app. Any addition here should also go into build-cpp.yml (and vice
      # versa). Philosophy: ship everything windeployqt might miss, even if
      # it's redundant — a 10MB larger installer is better than a crashing app.
      - name: Deploy Qt DLLs (windeployqt)
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          BUILD_DIR="build/Release"
          QT_BIN="${QT_ROOT_DIR}/bin"
          QT_PLUGINS="${QT_ROOT_DIR}/plugins"

          WDQT="${QT_BIN}/windeployqt.exe"
          [ -f "$WDQT" ] && "$WDQT" --release --no-translations --compiler-runtime \
            --include-soft-plugins --force "${BUILD_DIR}/${{ env.APP_NAME }}.exe"

          # qgeoview.dll is emitted by a FetchContent target and copied next to
          # the exe by a POST_BUILD custom_command — confirm it's present so we
          # catch the case where the custom_command silently failed.
          if [ -f "${BUILD_DIR}/qgeoview.dll" ]; then
            echo "qgeoview.dll present"
          else
            echo "::warning::qgeoview.dll missing from ${BUILD_DIR} — map widget will fail to load"
          fi

          # Qt Core DLLs — belt-and-suspenders for anything windeployqt misses.
          for qt_dll in \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Charts.dll Qt6PrintSupport.dll \
            Qt6Network.dll Qt6Sql.dll Qt6Concurrent.dll Qt6WebSockets.dll \
            Qt6Multimedia.dll Qt6MultimediaWidgets.dll Qt6OpenGL.dll \
            Qt6OpenGLWidgets.dll Qt6Svg.dll Qt6Xml.dll Qt6TextToSpeech.dll; do
            [ -f "${QT_BIN}/${qt_dll}" ] && [ ! -f "${BUILD_DIR}/${qt_dll}" ] && \
              cp "${QT_BIN}/${qt_dll}" "${BUILD_DIR}/" || true
          done

          # OpenSSL — Qt6::Network needs these for HTTPS. Qt ships them in its
          # own bin/. Include the 1.1 names as a fallback for older Qt kits.
          for ssl_dll in \
            libssl-3-x64.dll libcrypto-3-x64.dll \
            libssl-3.dll     libcrypto-3.dll \
            libssl-1_1-x64.dll libcrypto-1_1-x64.dll; do
            [ -f "${QT_BIN}/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${QT_BIN}/${ssl_dll}" "${BUILD_DIR}/" || true
            [ -f "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" "${BUILD_DIR}/" || true
          done

          # MSVC runtime — --compiler-runtime covers most but not all VS2022 17.x
          # DLLs (msvcp170, vcruntime140_2, vccorlib140 are sometimes missed).
          for vcrt_dll in \
            vcruntime140.dll vcruntime140_1.dll vcruntime140_2.dll \
            msvcp140.dll msvcp140_1.dll msvcp140_2.dll \
            msvcp170.dll \
            concrt140.dll vccorlib140.dll; do
            SYS32="/c/Windows/System32/${vcrt_dll}"
            [ -f "$SYS32" ] && [ ! -f "${BUILD_DIR}/${vcrt_dll}" ] && \
              cp "$SYS32" "${BUILD_DIR}/" || true
          done

          # Qt plugin directories — whole-dir copy so we pick up every provided
          # plugin without maintaining a per-file allowlist.
          for plugin_dir in platforms sqldrivers imageformats iconengines styles tls \
            multimedia texttospeech networkinformation platforminputcontexts printsupport generic; do
            [ -d "${QT_PLUGINS}/${plugin_dir}" ] && \
              { mkdir -p "${BUILD_DIR}/${plugin_dir}"; \
                cp -n "${QT_PLUGINS}/${plugin_dir}/"*.dll "${BUILD_DIR}/${plugin_dir}/" 2>/dev/null || true; }
          done

          # Direct3D compiler + OpenGL SW fallback — needed on VMs / headless
          # machines without a proper GPU driver. dxcompiler/dxil: Qt 6.6+ D3D12
          # backend (DXC shader compiler) — on Win11 boxes without WinSDK.
          for d3d_dll in \
            d3dcompiler_47.dll opengl32sw.dll libEGL.dll libGLESv2.dll \
            dxcompiler.dll dxil.dll; do
            [ -f "${QT_BIN}/${d3d_dll}" ] && [ ! -f "${BUILD_DIR}/${d3d_dll}" ] && \
              cp "${QT_BIN}/${d3d_dll}" "${BUILD_DIR}/" || true
          done

          # ICU — Qt 6 on Windows ships its own ICU for Unicode support.
          for icu_dll in "${QT_BIN}"/icu*.dll; do
            base=$(basename "$icu_dll")
            [ -f "$icu_dll" ] && [ ! -f "${BUILD_DIR}/${base}" ] && \
              cp "$icu_dll" "${BUILD_DIR}/" || true
          done

          cp -r resources "${BUILD_DIR}/resources" 2>/dev/null || true
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_scripts.sh" scripts "${BUILD_DIR}/scripts"
          # qt.conf — pins plugin and data paths relative to the executable.
          # Without this, Qt falls back to hardcoded build-time paths which
          # don't exist on a clean machine and cause plugin load failures.
          printf '[Paths]\nPrefix = .\nPlugins = .\nLibraries = .\n' > "${BUILD_DIR}/qt.conf"

          # Fail early if anything essential didn't make it into the stage dir.
          echo ""
          echo "=== Staged Windows payload ==="
          MISSING=0
          for essential in \
            "${{ env.APP_NAME }}.exe" \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll \
            platforms/qwindows.dll sqldrivers/qsqlite.dll \
            tls/qschannelbackend.dll; do
            if [ ! -f "${BUILD_DIR}/${essential}" ]; then
              echo "::error::Missing essential file: ${essential}"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 1 ] && exit 1
          echo "=== $(find "${BUILD_DIR}" -type f | wc -l) files staged ==="

      # ── Generate Installer ────────────────────────────────────────────────
      - name: Generate Installer (CPack IFW)
        shell: bash
        working-directory: app/build
        run: |
          set -euo pipefail
          export PATH="${QT_IFW_DIR}/bin:${PATH}"
          command -v binarycreator || { echo "::error::binarycreator not found"; exit 1; }
          cpack -G IFW -C ${{ env.BUILD_TYPE }} --verbose
          ls -lh ${{ env.APP_NAME }}-*-setup* 2>/dev/null || ls -lh *.exe 2>/dev/null || true

      # ── Install it and prove it gets data ─────────────────────────────────
      # What a user does, on a clean Windows machine: run the installer, start
      # the app. The app then has to download uv, install Python, build its two
      # environments, start the data daemon and reach Yahoo — a chain no unit
      # test covers, and one that was broken on Windows end to end (the daemon
      # could not start at all) without anything here noticing. `--selftest`
      # runs exactly that chain headlessly and exits non-zero if no quote comes
      # back; a failure here stops the release.
      - name: Install with the generated installer
        shell: bash
        working-directory: app/build
        run: |
          set -euo pipefail
          INSTALLER="$(ls ${{ env.APP_NAME }}-*-windows-x64-setup.exe | head -1)"
          ROOT="${RUNNER_TEMP}/finterm-install"
          rm -rf "${ROOT}"
          "./${INSTALLER}" install --root "$(cygpath -w "${ROOT}")" \
              --accept-licenses --default-answer --confirm-command
          EXE="$(find "${ROOT}" -maxdepth 2 -name '${{ env.APP_NAME }}.exe' | head -1)"
          [ -n "${EXE}" ] || { echo "::error::installed tree has no ${{ env.APP_NAME }}.exe"; find "${ROOT}" -maxdepth 2 | head -50; exit 1; }
          echo "Installed: ${EXE}"
          [ -f "$(dirname "${EXE}")/scripts/yfinance_data.py" ] || { echo "::error::installed tree has no scripts/yfinance_data.py"; exit 1; }
          echo "FINTERM_INSTALLED_EXE=${EXE}" >> "$GITHUB_ENV"

      # ── The in-place update package ───────────────────────────────────────
      # What the installer just put there (before anything has run from it),
      # without the installer's own files: what apply-update.ps1 unpacks beside
      # an install. updates.json points at it (inplace-url).
      - name: Package the in-place update (zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Split-Path -Parent ($env:FINTERM_INSTALLED_EXE -replace '/', '\')
          $stage = Join-Path $env:RUNNER_TEMP "update-package"
          Copy-Item -Recurse -Path $dir -Destination $stage
          $own = "FintermMaintenanceTool*", "components.xml", "network.xml", "InstallationLog.txt", "installer.dat", "installerResources", "Licenses"
          Get-ChildItem -LiteralPath $stage -Force | Where-Object { $n = $_.Name; $own | Where-Object { $n -like $_ } } |
              ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          $setup = (Get-ChildItem "app/build/finterm-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          $zip = $setup -replace '-setup\.exe$', '-update.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          "top level: " + ((Get-ChildItem -Force $stage | Select-Object -Expand Name) -join " ")
          "installer's own: " + ((Get-ChildItem -Force $dir | Where-Object { -not (Test-Path (Join-Path $stage $_.Name)) } | Select-Object -Expand Name) -join " ")
          Get-Item $zip | Select-Object Name, Length

      - name: Self-test the installed app (Python setup, data daemon, one quote)
        shell: bash
        timeout-minutes: 50
        run: |
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/selftest.json"
          rm -f "${REPORT}"
          CODE=0   # the shell runs with -e: a failure must not end the step unreported
          "${FINTERM_INSTALLED_EXE}" --profile selftest --selftest "$(cygpath -w "${REPORT}")" || CODE=$?
          echo "exit code: ${CODE}"
          echo "=== report ==="
          cat "${REPORT}" 2>/dev/null || echo "(no report written)"
          if [ "${CODE}" -ne 0 ] || ! grep -q '"ok": true' "${REPORT}" 2>/dev/null; then
            echo "=== app log (tail) ==="
            find "${LOCALAPPDATA:-/c/Users/runneradmin/AppData/Local}" "${APPDATA:-}" -name 'finterm.log' 2>/dev/null \
              | while read -r f; do echo "--- $f"; tail -n 150 "$f"; done
            echo "::error::the installed app failed its self-test: $(jq -r '.stage + ": " + .detail' "${REPORT}" 2>/dev/null || echo "no report")"
            exit 1
          fi

      # ── In-place update: the helper the app runs, on the real install ─────
      # apply-update.ps1 (embedded in the app) unpacks the release's zip beside
      # the install and swaps the folders; a rollback swaps them back; killed
      # while it unpacks, the install is untouched; and the uninstaller still
      # works afterwards. The same version stands in for the next one.
      - name: In-place update and rollback (apply-update.ps1)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = $env:FINTERM_INSTALLED_EXE -replace '/', '\'
          $dir = Split-Path -Parent $exe
          # An earlier step left PATH in bash form; a user's is this.
          $sys = Join-Path $env:SystemRoot "System32"
          $env:PATH = "$sys;$env:SystemRoot;$sys\Wbem;$sys\WindowsPowerShell\v1.0"
          $winps = Join-Path $sys "WindowsPowerShell\v1.0\powershell.exe"
          $helper = (Resolve-Path "app/src/services/updater/scripts/apply-update.ps1").Path
          $built = (Get-ChildItem "app/build/finterm-*-windows-x64-update.zip" | Select-Object -First 1).FullName
          $zip = Join-Path $env:RUNNER_TEMP "update test.zip" # a copy (the helper deletes it), a space in the name
          $status = Join-Path $env:RUNNER_TEMP "update-status.json"
          $prev = "$dir.previous"
          $old = Join-Path $dir "marker-old.txt"
          Set-Content -Path $old -Value "old"
          $data = Join-Path $env:LOCALAPPDATA "finterm\ci-user-data.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $data) | Out-Null
          Set-Content -Path $data -Value "mine"
          function Helper([string[]]$more) {
              # As the app starts it: one command line, paths quoted.
              $a = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$helper`"", "-AppPid", "0", "-InstallDir", "`"$dir`"",
                     "-Previous", "`"$prev`"", "-Status", "`"$status`"") + $more
              Start-Process -FilePath $winps -ArgumentList $a -PassThru -NoNewWindow
          }
          function Done($p) {
              $p.WaitForExit()
              Get-Content $status | Write-Host
              $s = Get-Content $status | ConvertFrom-Json
              if (-not $s.ok) { throw "the helper failed: $($s.message)" }
          }

          # 1. Update: swapped, previous kept, installer's files and data kept.
          Copy-Item -Force $built $zip
          Done (Helper @("-Package", "`"$zip`"", "-From", "0.0.1", "-To", "9.9.9"))
          if (-not (Test-Path $exe)) { throw "finterm.exe missing after the update" }
          if (-not (Test-Path (Join-Path $dir "scripts/yfinance_data.py"))) { throw "scripts missing after the update" }
          if (Test-Path $old) { throw "the old version was not replaced" }
          if (-not (Test-Path (Join-Path $prev "marker-old.txt"))) { throw "the previous version was not kept" }
          if (-not (Test-Path (Join-Path $dir "FintermMaintenanceTool.exe"))) { throw "the uninstaller is gone" }
          foreach ($n in "new", "ready", "previous.old") { if (Test-Path "$dir.$n") { throw "$dir.$n was left behind" } }
          $lists = { param($d) (Get-ChildItem -Recurse -File (Join-Path $d "installerResources") -ErrorAction SilentlyContinue | Measure-Object).Count }
          if ((& $lists $dir) -ne (& $lists $prev)) { throw "the installer's file lists were not carried over" }
          $once = "HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce"
          if ((Get-ItemProperty -Path $once -ErrorAction SilentlyContinue)."finterm-update") { throw "the recovery task is still registered" }
          $apps = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
              Where-Object { $_.InstallLocation -and $_.InstallLocation.Replace('/', '\').TrimEnd('\') -ieq $dir }
          if ($apps.DisplayVersion -ne "9.9.9") { throw "the Apps entry says '$($apps.DisplayVersion)'" }
          Write-Host "update: OK"

          # 2. Rollback.
          Done (Helper @("-From", "9.9.9", "-To", "0.0.1", "-Rollback"))
          if (-not (Test-Path $old)) { throw "the rollback did not restore the previous version" }
          if (Test-Path "$dir.failed") { throw "$dir.failed was left behind" }
          Write-Host "rollback: OK"

          # 3. Cut short while unpacking: the install is as it was.
          Copy-Item -Force $built $zip
          $p = Helper @("-Package", "`"$zip`"", "-From", "0.0.1", "-To", "9.9.9")
          for ($i = 0; -not (Test-Path "$dir.new\scripts") -and -not $p.HasExited -and $i -lt 2400; $i++) { Start-Sleep -Milliseconds 25 }
          if ($p.HasExited) { throw "the test did not interrupt the update" }
          $p.Kill(); $p.WaitForExit()
          if (-not (Test-Path $old) -or -not (Test-Path $exe)) { throw "an interrupted update changed the install" }
          Write-Host "interrupted: OK"

          # 4. A file held open in the install: refused whole, then it works.
          $held = [System.IO.File]::Open((Join-Path $dir "scripts/yfinance_data.py"), "Open", "Read", "None")
          $p = Helper @("-Package", "`"$zip`"", "-From", "0.0.1", "-To", "9.9.9"); $p.WaitForExit()
          $s = Get-Content $status | ConvertFrom-Json
          $held.Close()
          if ($s.ok) { throw "an install with a file held open was reported updated" }
          Write-Host "held open: $($s.message)"
          if (-not (Test-Path $old) -or -not (Test-Path $exe)) { throw "a refused update changed the install" }
          Copy-Item -Force $built $zip
          Done (Helper @("-Package", "`"$zip`"", "-From", "0.0.1", "-To", "9.9.9"))
          if (Test-Path $old) { throw "the update after it did not go in" }

          # 4b. Cut short between the two renames: the logon line puts it back,
          # and does nothing when the install is there.
          Set-Content -Path (Join-Path $dir "marker-gap.txt") -Value "x"
          $line = "cmd.exe /d /c if not exist `"$dir`" move `"$prev`" `"$dir`""
          if ((Get-Content $helper -Raw) -notmatch 'cmd.exe /d /c if not exist `"\$InstallDir`" move `"\$from`" `"\$InstallDir`"') { throw "the helper's logon line changed; update this test" }
          cmd.exe /d /c "if not exist `"$dir`" move `"$prev`" `"$dir`""
          if (-not (Test-Path (Join-Path $dir "marker-gap.txt"))) { throw "the logon line touched a whole install" }
          [System.IO.Directory]::Move($dir, "$dir.gap")
          cmd.exe /d /c "if not exist `"$dir`" move `"$prev`" `"$dir`""
          if (-not (Test-Path $exe)) { throw "the logon line did not put the previous version back ($line)" }
          [System.IO.Directory]::Move($dir, $prev); [System.IO.Directory]::Move("$dir.gap", $dir)

          # 5. The new version starts, the data is there, the uninstaller works.
          $report = Join-Path $env:RUNNER_TEMP "updated-selftest.json"
          $p = Start-Process -FilePath $exe -ArgumentList @("--profile", "selftest", "--selftest", "`"$report`"") -PassThru -Wait
          if ((Get-Content $report -Raw) -notmatch '"ok": true') { Get-Content $report; throw "the updated app failed its self-test ($($p.ExitCode))" }
          if (-not (Test-Path $data)) { throw "the user's data was removed" }
          $t = Start-Process -FilePath (Join-Path $dir "FintermMaintenanceTool.exe") -Wait -PassThru -ArgumentList @("purge", "--default-answer", "--confirm-command")
          for ($i = 0; (Test-Path $exe) -and $i -lt 60; $i++) { Start-Sleep -Seconds 1 }
          if ($t.ExitCode -ne 0 -or (Test-Path $exe)) { throw "uninstalling after an update failed ($($t.ExitCode))" }
          if (-not (Test-Path $data)) { throw "uninstalling removed the user's data" }
          if (-not (Test-Path $built)) { throw "the release package is gone" }
          Write-Host "in-place update + rollback + interruption + uninstall OK"

      # ── Default install folder: per user, writable, no admin ─────────────
      # What a user gets by just running the installer: %LOCALAPPDATA%\Programs
      # \finterm — where the in-place updater can replace the app.
      - name: Default install folder is per user
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem "app/build/finterm-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          . ./.github/ci/ifw-setup.ps1
          Setup $setup "default install"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\finterm"
          if (-not (Test-Path (Join-Path $dir "finterm.exe"))) {
              Get-ChildItem -Recurse -Depth 1 (Join-Path $env:LOCALAPPDATA "Programs") -ErrorAction SilentlyContinue | Select-Object -First 40 | Out-Host
              throw "the default install is not in $dir"
          }
          if (-not (Test-Path (Join-Path $dir "FintermMaintenanceTool.exe"))) { throw "no maintenance tool beside finterm.exe" }
          Write-Host "default install: $dir"

          # The control script's Apps-list lookup, run for real (the node test
          # checks it by its structure only), in Full Language and restricted
          # (Constrained Language, asserted): it finds this install, read in
          # full; a key that isn't there is an empty list; a drive that isn't
          # there is unreadable (its own UNREADABLE and exit 1, not a crash).
          $lookup = & node app/tests/installer/print_apps_lookup.js app/packaging/installer/config/controlscript.qs
          if ($LASTEXITCODE -ne 0 -or -not $lookup) { throw "print_apps_lookup.js failed" }
          $winps = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          function Lookup([string]$command, [bool]$restricted) {
              $mode = if ($restricted) { "ConstrainedLanguage" } else { "FullLanguage" }
              $out = @(& $winps -NoProfile -ExecutionPolicy Bypass -Command (
                  "`$ExecutionContext.SessionState.LanguageMode = '$mode'; 'MODE ' + `$ExecutionContext.SessionState.LanguageMode; " + $command))
              $code = $LASTEXITCODE
              if ($out -notcontains "MODE $mode") { throw "the lookup did not run in $mode`: $out" }
              return @{ code = $code; out = $out; locations = @($out | Where-Object { $_ -like "L *" } |
                  ForEach-Object { [uri]::UnescapeDataString($_.Substring(2)).Replace('/', '\').TrimEnd('\') }) }
          }
          $key = "CurrentVersion\Uninstall'"
          if (([regex]::Matches($lookup, [regex]::Escape($key))).Count -ne 1) { throw "the lookup's key is not where expected" }
          $missingKey = $lookup.Replace($key, "CurrentVersion\Uninstall\finterm-ci-no-such-key'")
          if (([regex]::Matches($lookup, [regex]::Escape("'HKCU:\"))).Count -ne 1) { throw "the lookup's drive is not where expected" }
          $missingDrive = $lookup.Replace("'HKCU:\", "'HKNOPE:\")
          foreach ($restricted in $false, $true) {
              $how = if ($restricted) { " (restricted)" } else { "" }
              $r = Lookup $lookup $restricted
              if ($r.code -ne 0) { throw "the Apps-list lookup failed$how ($($r.code)): $($r.out)" }
              if ($r.out -contains "PARTIAL") { throw "the Apps-list lookup read the list only in part${how}: $($r.out)" }
              if (-not ($r.locations | Where-Object { $_ -ieq $dir })) { throw "the Apps-list lookup did not find $dir$how" }
              $r = Lookup $missingKey $restricted
              if ($r.code -ne 0 -or $r.locations.Count -ne 0) { throw "a missing key was not an empty list$how ($($r.code)): $($r.out)" }
              $r = Lookup $missingDrive $restricted
              if ($r.code -ne 1 -or $r.out -notcontains "UNREADABLE" -or $r.locations.Count -ne 0) {
                  throw "a missing drive was not unreadable$how ($($r.code)): $($r.out)"
              }
          }
          Write-Host "Apps-list lookup: found $dir; a missing key is empty, a missing drive unreadable (also restricted)"

          # Run again over it — an update in place: the old copy is removed by
          # its own uninstaller (keeping the data), then this one goes in.
          $mark = Join-Path $env:LOCALAPPDATA "finterm\ci-update-mark.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $mark) | Out-Null
          Set-Content -Path $mark -Value "mine"
          $zip = (Get-ChildItem "app/build/finterm-*-windows-x64-update.zip" | Select-Object -First 1).FullName
          $unz = Join-Path $env:RUNNER_TEMP "over-unz"
          Expand-Archive -Path $zip -DestinationPath $unz -Force
          $want = (Get-FileHash (Get-ChildItem -Recurse -Filter finterm.exe $unz | Select-Object -First 1).FullName).Hash
          $exe = Join-Path $dir "finterm.exe"

          # Unattended without UpdateExisting: refused, the install untouched.
          [System.IO.File]::AppendAllText($exe, "ci-old-copy")
          $kept = (Get-FileHash $exe).Hash
          $refused = $false
          try { Setup $setup "installing over the install without UpdateExisting" } catch { $refused = $true }
          if (-not $refused) { throw "an unattended install over an install went ahead without UpdateExisting" }
          if (-not (Select-String -Path (Join-Path $env:RUNNER_TEMP "setup-out.txt"), (Join-Path $env:RUNNER_TEMP "setup-err.txt") -Pattern "TargetDirectoryInUse" -Quiet)) {
              throw "the install over the install failed, but not by IFW's folder check"
          }
          if ((Get-FileHash $exe).Hash -ne $kept) { throw "a refused install changed the installed copy" }

          # Updated: unattended with UpdateExisting, then in the wizard. The
          # installed copy is marked first (bytes appended); afterwards it must
          # be this build's again, with its uninstaller, and the data kept.
          foreach ($way in "UpdateExisting", "GUI") {
              [System.IO.File]::AppendAllText($exe, "ci-old-copy")
              if ($way -eq "GUI") { GuiSetup $setup "updating in the wizard" }
              else { Setup $setup "updating unattended" @("UpdateExisting=true") }
              if ((Get-FileHash $exe).Hash -ne $want) { throw "${way}: the installed copy was not replaced" }
              # The old uninstaller's self-delete must not have taken the new tool.
              Start-Sleep -Seconds 15
              foreach ($f in @("finterm.exe", "FintermMaintenanceTool.exe")) {
                  if (-not (Test-Path (Join-Path $dir $f))) { throw "${way}: $f is missing after the update" }
              }
              if (-not (Test-Path $mark)) { throw "${way}: the update removed the user's data" }
              Write-Host "${way}: updated over the install: OK"
          }
          Remove-Item $mark

          $t = Start-Process -FilePath (Join-Path $dir "FintermMaintenanceTool.exe") -Wait -PassThru -ArgumentList @(
              "purge", "--default-answer", "--confirm-command")
          if ($t.ExitCode -ne 0) { throw "removing the default install failed ($($t.ExitCode))" }
          if (Test-Path (Join-Path $dir "finterm.exe")) { throw "the default install is still there after purge" }
          for ($i = 0; (Test-Path $dir) -and $i -lt 60; $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "the install in $dir was not removed" }
          Write-Host "removed"

      # ── Update from the published release ─────────────────────────────────
      # What an existing user does: run the new installer over the release
      # they have. It updates in place; the data stays. Skipped when no
      # release is published.
      - name: Update from the published release
        timeout-minutes: 30
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $sys = Join-Path $env:SystemRoot "System32"
          $env:PATH = "$sys;$env:SystemRoot;$sys\Wbem;$sys\WindowsPowerShell\v1.0;$env:ProgramFiles\GitHub CLI"
          $work = Join-Path $env:RUNNER_TEMP "published"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $tag = (& gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $tag) { Write-Host "::warning::no published release - update test skipped"; exit 0 }
          & gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "finterm-*-windows-x64-setup.exe" --dir $work
          if ($LASTEXITCODE -ne 0) { throw "cannot download $tag" }
          $old = (Get-ChildItem (Join-Path $work "finterm-*-windows-x64-setup.exe") | Select-Object -First 1).FullName
          $new = (Get-ChildItem "app/build/finterm-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          $install = @("install", "--accept-licenses", "--default-answer", "--confirm-command")
          $dir = Join-Path $env:LOCALAPPDATA "Programs\finterm"
          $mark = Join-Path $env:LOCALAPPDATA "finterm\ci-published-mark.txt"
          $p = Start-Process -FilePath $old -Wait -PassThru -ArgumentList $install
          if ($p.ExitCode -ne 0) { throw "$tag did not install ($($p.ExitCode))" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $mark) | Out-Null
          Set-Content -Path $mark -Value "mine"
          . ./.github/ci/ifw-setup.ps1
          GuiSetup $new "updating $tag in the wizard"
          Start-Sleep -Seconds 15
          foreach ($f in @("finterm.exe", "FintermMaintenanceTool.exe")) {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is missing after updating $tag" }
          }
          # The installed program is this build's (the one in its update zip).
          $zip = (Get-ChildItem "app/build/finterm-*-windows-x64-update.zip" | Select-Object -First 1).FullName
          $unz = Join-Path $work "unz"
          Expand-Archive -Path $zip -DestinationPath $unz -Force
          $want = (Get-ChildItem -Recurse -Filter finterm.exe $unz | Select-Object -First 1).FullName
          if ((Get-FileHash $want).Hash -ne (Get-FileHash (Join-Path $dir "finterm.exe")).Hash) {
              throw "after the update the installed finterm.exe is not this build's"
          }
          if (-not (Test-Path $mark)) { throw "updating $tag removed the user's data" }
          Write-Host "$tag -> this build: OK"
          $t = Start-Process -FilePath (Join-Path $dir "FintermMaintenanceTool.exe") -Wait -PassThru -ArgumentList @(
              "purge", "--default-answer", "--confirm-command")
          if ($t.ExitCode -ne 0) { throw "removing the updated install failed ($($t.ExitCode))" }
          for ($i = 0; (Test-Path $dir) -and $i -lt 60; $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "the install in $dir was not removed" }

      # ── A Program Files copy ──────────────────────────────────────────────
      # finterm up to 4.0.10 installed into Program Files (by an administrator,
      # shared by every user); 4.1.0 and later per user. What such a user
      # meets: unattended without UpdateExisting, refused — nothing installs
      # beside it; with it (and in the wizard), the copy is removed elevated,
      # keeping the data, and this one installs per user. The copy is this
      # build, put there with --root (4.0.10 itself is purged); the runner is
      # an administrator, so the elevation asks nothing.
      - name: Update over a Program Files copy
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./.github/ci/ifw-setup.ps1
          $new = (Get-ChildItem "app/build/finterm-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          $pf = Join-Path $env:ProgramFiles "finterm"
          $pu = Join-Path $env:LOCALAPPDATA "Programs\finterm"
          $out = Join-Path $env:RUNNER_TEMP "setup-out.txt"; $err = Join-Path $env:RUNNER_TEMP "setup-err.txt"
          $mark = Join-Path $env:LOCALAPPDATA "finterm\ci-user-data.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $mark) | Out-Null
          Set-Content -Path $mark -Value "mine"
          foreach ($way in "UpdateExisting", "GUI") {
              Setup $new "a copy in Program Files" @("--root", "`"$pf`"") # a space in the path
              if (-not (Test-Path (Join-Path $pf "FintermMaintenanceTool.exe"))) { throw "no copy in $pf" }
              if ($way -eq "UpdateExisting") {
                  # Without UpdateExisting: refused by finterm (IFW's folder
                  # check sees an empty per-user target) — the install's own
                  # error, not the line the control script logs when it loads.
                  $refused = $false
                  try { Setup $new "installing beside it without UpdateExisting" } catch { $refused = $true }
                  if (-not $refused) { throw "an unattended install went in beside a Program Files copy" }
                  $why = Get-Content $out, $err -ErrorAction SilentlyContinue |
                      Where-Object { $_ -match "add UpdateExisting=true" -and $_ -notmatch "\[finterm\] refused" }
                  if (-not $why) { throw "the install beside it failed, but not by finterm's refusal" }
                  if (Test-Path (Join-Path $pu "finterm.exe")) { throw "a refused install left files in $pu" }
                  if (-not (Test-Path (Join-Path $pf "finterm.exe"))) { throw "a refused install removed the copy" }
                  Setup $new "updating it unattended" @("UpdateExisting=true")
              } else {
                  GuiSetup $new "updating it in the wizard"
              }
              if (Test-Path $pf) { throw "${way}: the Program Files copy is still there" }
              if (-not (Test-Path (Join-Path $pu "finterm.exe"))) { throw "${way}: finterm is not in $pu" }
              if (-not (Test-Path $mark)) { throw "${way}: the user's data was removed" }
              Write-Host "${way}: Program Files copy -> per user: OK"
              $t = Start-Process -FilePath (Join-Path $pu "FintermMaintenanceTool.exe") -Wait -PassThru -ArgumentList @(
                  "purge", "--default-answer", "--confirm-command")
              if ($t.ExitCode -ne 0) { throw "${way}: removing the per-user install failed ($($t.ExitCode))" }
              for ($i = 0; (Test-Path $pu) -and $i -lt 120; $i++) { Start-Sleep -Milliseconds 500 }
              if (Test-Path $pu) { throw "${way}: the per-user install was not removed" }
          }

      # ── Upload ────────────────────────────────────────────────────────────
      # Narrow the glob to the installer output — the broader `*.exe` pattern
      # would also catch the main finterm.exe binary, which we don't
      # want to publish as a release asset (users should run the installer).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finterm-Windows-x64-installer
          path: |
            app/build/finterm-*-windows-x64-setup.exe
            app/build/finterm-*-windows-x64-update.zip
          if-no-files-found: error
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 — Linux x64 Installer (self-contained AppImage, served as .run)
# ═════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux x64 Installer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-x64-release-${{ env.QT_VERSION }}
          max-size: 500M
          # update-package-index is unset: the "Install system dependencies"
          # step below already runs apt-get update, so this action's own
          # update is redundant and was observed to hang the runner.

      # ── System deps ───────────────────────────────────────────────────────
      # ubuntu-22.04 ships g++ 11.4 by default, but CMakeLists.txt enforces
      # GCC 12.3+. Install gcc-12/g++-12 and pin CC/CXX for the rest of the job.
      # We intentionally do NOT install apt Qt packages — ubuntu-22.04 ships
      # Qt 6.2 and CMakeLists pins Qt 6.8.3 EXACT. Qt is installed via
      # jurplel/install-qt-action below, matching the Windows and macOS jobs.
      # We still need the XCB / GL system libs so Qt's xcb platform plugin
      # can link at build time and load at runtime.
      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build gcc-12 g++-12 \
            libssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-cursor-dev \
            libxcb-icccm4 libxcb-icccm4-dev \
            libxcb-image0  libxcb-image0-dev \
            libxcb-keysyms1 libxcb-keysyms1-dev \
            libxcb-randr0 \
            libxcb-render-util0 libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0 libxcb-xinerama0-dev \
            libxcb-xkb1 libxkbcommon-x11-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            python3 python3-pip pkg-config zip \
            wget file libfuse2 patchelf
          echo "CC=gcc-12"  >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      # ── Qt 6.8.3 (matches CMakeLists' Qt6 EXACT pin) ──────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-linux-x64-release

      # ── Configure + Build ─────────────────────────────────────────────────
      # No FINTERM_BUILD_INSTALLER / no QtIFW on Linux — we ship an AppImage
      # instead (see "Build AppImage" step below).
      - name: Configure CMake
        working-directory: app
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFINTERM_QT_STRICT=ON \
            -DFINTERM_RELEASE_BUILD=ON \
            -DOPENSSL_ROOT_DIR=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        working-directory: app
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $(nproc)

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        working-directory: app
        run: |
          BINARY="build/${{ env.APP_NAME }}.bin"
          [ -f "$BINARY" ] || { echo "::error::Binary not found"; exit 1; }
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"
          file "$BINARY"

      # ── Build self-contained AppImage ─────────────────────────────────────
      # The previous release workflow ran CPack IFW on Linux but didn't bundle
      # Qt at all — the installer produced a "binary + desktop file" payload
      # that crashed on every machine missing the matching apt Qt. We now ship
      # an AppImage instead: linuxdeploy walks the binary's needed-libraries
      # list, pulls in every transitive .so (Qt + XCB + ICU + OpenSSL + GL),
      # patchelfs the RPATH, and bakes it all into one executable file the
      # auto-updater can chmod+launch like a .run.
      #
      # Filename keeps the `-linux-x64-setup.run` suffix so it matches the
      # regex in update-manifest (AppImage is just a self-mounting executable
      # — the updater's "chmod +x and launch" path works identically).
      - name: Build AppImage
        working-directory: app
        run: |
          set -euo pipefail
          APPDIR="build/AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          # Stage binary + desktop entry + icon
          cp "build/${{ env.APP_NAME }}.bin" "${APPDIR}/usr/bin/"
          chmod +x "${APPDIR}/usr/bin/${{ env.APP_NAME }}.bin"

          cat > "${APPDIR}/usr/share/applications/finterm.desktop" <<'EOF'
          [Desktop Entry]
          Name=finterm
          Exec=finterm.bin
          Icon=finterm
          Type=Application
          Categories=Finance;
          EOF

          # Icon — linuxdeploy requires a valid PNG (it runs libpng/CImg over
          # the file to generate scaled variants). Convert the repo's .ico to
          # a 256x256 PNG via ImageMagick (pre-installed on ubuntu-22.04). Fall
          # back to a generated solid-color PNG only if no source icon exists —
          # never hand-write PNG bytes inline, ImageMagick's CRC check rejects
          # anything with a malformed IDAT chunk.
          ICON_DEST="${APPDIR}/usr/share/icons/hicolor/256x256/apps/finterm.png"
          if [ -f "resources/icons/app_icon_256.png" ]; then
            cp "resources/icons/app_icon_256.png" "${ICON_DEST}"
          elif [ -f "resources/finterm.ico" ]; then
            # .ico may hold multiple frames — "ico:file[0]" selects the first,
            # which is conventionally the largest/primary. Explicit "ico:" prefix
            # forces the ICO decoder in case policy.xml has format detection quirks.
            convert "ico:resources/finterm.ico[0]" -resize 256x256 -background none -flatten "png:${ICON_DEST}"
          else
            # Solid-color 256x256 PNG as last resort. ImageMagick writes it
            # with a valid IDAT + CRC, unlike an inline printf of raw bytes.
            convert -size 256x256 xc:'#1a1a1a' "png:${ICON_DEST}"
          fi

          # Sanity check — a broken PNG here will fail the AppImage build
          # 30 seconds later inside linuxdeploy, so fail fast with a clear error.
          # Check: file exists, is non-empty, `file` reports PNG, and libpng's
          # own `pngcheck`-equivalent (imagemagick `identify`) can parse it.
          if [ ! -s "${ICON_DEST}" ]; then
            echo "::error::Icon at ${ICON_DEST} is missing or empty"
            ls -la "${ICON_DEST}" 2>&1 || true
            exit 1
          fi
          if ! file "${ICON_DEST}" | grep -q 'PNG image data'; then
            echo "::error::Icon at ${ICON_DEST} is not a valid PNG"
            file "${ICON_DEST}"
            exit 1
          fi
          if ! identify "${ICON_DEST}" >/dev/null 2>&1; then
            echo "::error::Icon at ${ICON_DEST} failed ImageMagick identify — libpng will reject it"
            identify "${ICON_DEST}" 2>&1 || true
            exit 1
          fi
          echo "Icon OK: $(identify -format '%wx%h %m' "${ICON_DEST}")"

          # App resources + Python analytics scripts live next to the binary
          # (matches AppPaths resolution on Linux).
          cp -r resources "${APPDIR}/usr/bin/resources" 2>/dev/null || true
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_scripts.sh" scripts "${APPDIR}/usr/bin/scripts"

          # Requirements files — PythonSetupManager reads these at first run.
          mkdir -p "${APPDIR}/usr/bin/resources"
          cp resources/requirements-numpy1.txt "${APPDIR}/usr/bin/resources/" 2>/dev/null || true
          cp resources/requirements-numpy2.txt "${APPDIR}/usr/bin/resources/" 2>/dev/null || true

          # Download linuxdeploy + Qt plugin
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # linuxdeploy-plugin-qt uses qmake to locate Qt. Point it at the
          # jurplel-installed Qt 6.8.3 rather than the (absent) apt qmake6.
          # Without this the plugin either no-ops or picks up system Qt.
          export PATH="${QT_ROOT_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"

          # ── Strip unused Qt SQL driver plugins ───────────────────────────
          # We only use SQLite. linuxdeploy-plugin-qt walks every plugin in
          # Qt's sqldrivers/ folder and tries to resolve its dependencies —
          # the Mimer plugin pulls in libmimerapi.so, which isn't installed
          # on the runner and causes the deploy step to fail.
          if [ -d "${QT_ROOT_DIR}/plugins/sqldrivers" ]; then
            rm -f "${QT_ROOT_DIR}/plugins/sqldrivers/libqsqlmimer.so" \
                  "${QT_ROOT_DIR}/plugins/sqldrivers/libqsqlodbc.so" \
                  "${QT_ROOT_DIR}/plugins/sqldrivers/libqsqlpsql.so" \
                  "${QT_ROOT_DIR}/plugins/sqldrivers/libqsqlmysql.so"
          fi

          # Filename must match the regex in update-manifest:
          #   finterm-<version>-linux-x64-setup.run
          # where <version> is CMAKE_PROJECT_VERSION (e.g. 4.0.2), NOT the
          # tag (v4.0.2). Parse project() VERSION from CMakeLists.txt so we
          # stay in sync even when triggered via workflow_dispatch (no tag).
          VERSION=$(grep -Po 'project\(finterm VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not parse project VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "Package version: ${VERSION}"

          # Build the AppImage. The qt plugin traces Qt plugin dependencies
          # (platforms, sqldrivers, imageformats, tls, iconengines, svg, etc.)
          # in addition to the core Qt libs. UPDATE_INFORMATION embeds the
          # zsync update URL so AppImageUpdate can fetch deltas later.
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export OUTPUT="finterm-${VERSION}-linux-x64-setup.run"
          export UPDATE_INFORMATION="gh-releases-zsync|yumima|finterm|latest|finterm-*-linux-x64-setup.run.zsync"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "${APPDIR}" \
            --plugin qt \
            --output appimage \
            --desktop-file "${APPDIR}/usr/share/applications/finterm.desktop" \
            --icon-file "${ICON_DEST}" \
            2>&1

          # linuxdeploy names the output after the desktop entry — find it.
          if [ ! -f "${OUTPUT}" ]; then
            PRODUCED=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
            if [ -z "${PRODUCED}" ]; then
              echo "::error::AppImage build failed — no .AppImage produced"
              ls -la
              exit 1
            fi
            mv "${PRODUCED}" "${OUTPUT}"
          fi
          chmod +x "${OUTPUT}"

          # Sanity check — AppImage must be ≥ 50MB (bare binary is ~20MB, +Qt
          # libs brings it to 80-150MB). A tiny AppImage means Qt wasn't bundled.
          SIZE_KB=$(du -k "${OUTPUT}" | cut -f1)
          if [ "${SIZE_KB}" -lt 51200 ]; then
            echo "::error::AppImage is only ${SIZE_KB}KB — Qt libs likely not bundled"
            exit 1
          fi

          # Stage in build/ where the upload step expects it.
          mkdir -p build
          mv "${OUTPUT}" "build/${OUTPUT}"
          echo "AppImage: build/${OUTPUT} ($(du -sh "build/${OUTPUT}" | cut -f1))"

          # Generate zsync file for delta updates (optional — manifest job
          # works fine without it).
          if command -v zsyncmake >/dev/null 2>&1; then
            zsyncmake "build/${OUTPUT}" -o "build/${OUTPUT}.zsync" || true
          else
            sudo apt-get install -y zsync -qq 2>/dev/null || true
            command -v zsyncmake >/dev/null 2>&1 && \
              zsyncmake "build/${OUTPUT}" -o "build/${OUTPUT}.zsync" || true
          fi

      # ── Run it and prove it gets data ─────────────────────────────────────
      # The same check as the Windows job, on the file a Linux user downloads:
      # the AppImage itself, started the way they start it. See SelfTest.h.
      - name: Self-test the AppImage (Python setup, data daemon, one quote)
        timeout-minutes: 50
        working-directory: app/build
        run: |
          set -uo pipefail
          sudo apt-get install -y xvfb -qq
          APPIMAGE="$(ls finterm-*-linux-x64-setup.run | head -1)"
          REPORT="${RUNNER_TEMP}/selftest.json"
          rm -f "${REPORT}"
          # No FUSE on the runner: extract-and-run is the documented fallback
          # and runs the same payload. xvfb gives Qt a display; nothing is shown.
          CODE=0   # the shell runs with -e: a failure must not end the step unreported
          xvfb-run -a "./${APPIMAGE}" --appimage-extract-and-run --profile selftest --selftest "${REPORT}" || CODE=$?
          echo "exit code: ${CODE}"
          cat "${REPORT}" 2>/dev/null || echo "(no report written)"
          if [ "${CODE}" -ne 0 ] || ! grep -q '"ok": true' "${REPORT}" 2>/dev/null; then
            find "${HOME}/.local/share/finterm" -name 'finterm.log' 2>/dev/null \
              | while read -r f; do echo "--- $f"; tail -n 150 "$f"; done
            echo "::error::the AppImage failed its self-test: $(jq -r '.stage + ": " + .detail' "${REPORT}" 2>/dev/null || echo "no report")"
            exit 1
          fi

      # ── In-place update: the helper the app runs, on the real AppImage ────
      - name: In-place update and rollback (apply-update.sh, AppImage)
        timeout-minutes: 10
        working-directory: app
        run: |
          set -euo pipefail
          sh tests/updater/test_apply_update.sh src/services/updater/scripts/apply-update.sh
          node tests/installer/test_installscript.js packaging/installer/packages/io.github.yumima.finterm.core/meta/installscript.qs packaging/installer/config/controlscript.qs
          BUILT="$(ls build/finterm-*-linux-x64-setup.run | head -1)"
          D="${RUNNER_TEMP}/appimage-update"; STATUS="${RUNNER_TEMP}/update-status.json"
          rm -rf "${D}"; mkdir -p "${D}"
          printf '#!/bin/sh\necho old\n' > "${D}/finterm.AppImage"; chmod +x "${D}/finterm.AppImage"
          cp "${BUILT}" "${D}/.finterm-9.9.9.AppImage"; chmod 0644 "${D}/.finterm-9.9.9.AppImage"
          run() { sh src/services/updater/scripts/apply-update.sh --target "${D}/finterm.AppImage" \
                     --previous "${D}/.finterm-previous.AppImage" --status "${STATUS}" "$@"; cat "${STATUS}"; grep -q '"ok":true' "${STATUS}"; }
          run --kind appimage --staged "${D}/.finterm-9.9.9.AppImage" --from 0.0.1 --to 0.0.2
          cmp "${BUILT}" "${D}/finterm.AppImage"
          WANT="finterm $(grep -h '^CMAKE_PROJECT_VERSION:' build/CMakeCache.txt | cut -d= -f2)"
          GOT="$("${D}/finterm.AppImage" --appimage-extract-and-run --version)"
          [ "${GOT}" = "${WANT}" ] || { echo "::error::the updated AppImage says '${GOT}', not '${WANT}'"; exit 1; }
          run --kind appimage-rollback --from 0.0.2 --to 0.0.1
          [ "$("${D}/finterm.AppImage")" = old ] || { echo "::error::rollback did not restore"; exit 1; }
          echo "in-place update + rollback OK"

      # ── The download installs itself: install, update, uninstall ──────────
      # What a user's first run of the .run offers, by its command-line form,
      # in a throwaway home: the image goes to ~/Applications/finterm.AppImage
      # with a launcher and a command; run again from elsewhere it updates in
      # one rename and keeps the previous; --uninstall removes what it added
      # and leaves the data.
      - name: Install, update and uninstall (AppImage)
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          BUILT="$(pwd)/$(ls build/finterm-*-linux-x64-setup.run | head -1)"
          H="${RUNNER_TEMP}/install-home"; rm -rf "${H}"; mkdir -p "${H}/Downloads" "${H}/.local/share/finterm/user"
          echo mine > "${H}/.local/share/finterm/user/ci-mark.txt"
          cp "${BUILT}" "${H}/Downloads/finterm-setup.run"
          fin() { env -u XDG_DATA_HOME -u XDG_CONFIG_HOME HOME="${H}" QT_QPA_PLATFORM=offscreen \
                    "$1" --appimage-extract-and-run "${@:2}"; }
          OUT="$(fin "${H}/Downloads/finterm-setup.run" --install --no-favourite)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true' >/dev/null
          APP="${H}/Applications/finterm.AppImage"
          cmp "${BUILT}" "${APP}"
          DESK="${H}/.local/share/applications/finterm.desktop"
          grep -q '^X-Finterm-Installer=1$' "${DESK}"
          # The launcher starts the script beside the image: mounted, or
          # unpacked when the runtime can't mount (the fallback is unit-tested
          # in test_install); here it starts either way.
          LAUNCH="${H}/Applications/.finterm-launch"
          grep -q "^Exec=${LAUNCH}$" "${DESK}"
          [ -x "${LAUNCH}" ]
          [ "$(env -u XDG_DATA_HOME -u XDG_CONFIG_HOME HOME="${H}" "${LAUNCH}" --version)" = \
            "finterm $(grep -h '^CMAKE_PROJECT_VERSION:' build/CMakeCache.txt | cut -d= -f2)" ]
          [ "$(readlink "${H}/.local/bin/finterm")" = "${H}/Applications/.finterm-launch" ]
          # Again, from another copy (the same version): put in place again,
          # in one rename; no "previous" made of it (that is a rollback's).
          cp "${BUILT}" "${H}/Downloads/finterm-again.run"
          OUT="$(fin "${H}/Downloads/finterm-again.run" --install --no-favourite)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true and (.done | any(test("installed:")))' >/dev/null
          cmp "${BUILT}" "${APP}"
          [ ! -e "${H}/Applications/.finterm-previous.AppImage" ]
          # The installed one knows it is the install.
          OUT="$(fin "${APP}" --install)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true and (.done | any(test("already running from")))' >/dev/null
          # Its data check runs, and finds nothing newer.
          OUT="$(fin "${APP}" --upgrade-data --check-only)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true and .newer_data == false' >/dev/null
          OUT="$(fin "${APP}" --uninstall)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true' >/dev/null
          [ ! -e "${APP}" ] && [ ! -e "${H}/Applications/.finterm-previous.AppImage" ] && [ ! -e "${DESK}" ]
          [ ! -e "${H}/.local/bin/finterm" ] && [ ! -e "${LAUNCH}" ]
          grep -q mine "${H}/.local/share/finterm/user/ci-mark.txt"
          echo "install + update + uninstall OK"

      # ── Upload ────────────────────────────────────────────────────────────
      # Version-stamped filename so update-manifest regex picks it up.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finterm-Linux-x64-installer
          path: |
            app/build/finterm-*-linux-x64-setup.run
            app/build/finterm-*-linux-x64-setup.run.zsync
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 3 — macOS arm64 Installer (DMG via QtIFW or hdiutil fallback)
# ═════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS arm64 Installer
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-arm64-release-${{ env.QT_VERSION }}
          max-size: 500M

      - name: Install build tools
        run: brew install ninja cmake || brew upgrade ninja cmake || true

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-macos-arm64-release

      - name: Install Python 3.12
        run: brew install python@3.12 || brew upgrade python@3.12 || true

      # ── Icon ──────────────────────────────────────────────────────────────
      - name: Generate .icns icon
        working-directory: app
        run: |
          ICO="resources/finterm.ico"
          ICNS="resources/finterm.icns"
          if [ -f "${ICNS}" ]; then
            echo ".icns already exists"
          elif [ -f "${ICO}" ]; then
            ICONSET="$(mktemp -d)/finterm.iconset"
            mkdir -p "${ICONSET}"
            sips -s format png "${ICO}" --out "${ICONSET}/icon_512x512.png" \
              --resampleHeightWidth 512 512 2>/dev/null
            for size in 16 32 64 128 256; do
              sips -z ${size} ${size} "${ICONSET}/icon_512x512.png" \
                --out "${ICONSET}/icon_${size}x${size}.png" 2>/dev/null
            done
            cp "${ICONSET}/icon_512x512.png" "${ICONSET}/icon_256x256@2x.png"
            sips -z 1024 1024 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_512x512@2x.png" 2>/dev/null
            sips -z 64  64  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_32x32@2x.png" 2>/dev/null
            sips -z 32  32  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_16x16@2x.png" 2>/dev/null
            sips -z 256 256 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_128x128@2x.png" 2>/dev/null
            iconutil -c icns -o "${ICNS}" "${ICONSET}"
            echo "Generated ${ICNS}"
          else
            echo "WARNING: No source icon — app will use generic icon"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      # No FINTERM_BUILD_INSTALLER on macOS — we ship a DMG built from the
      # post-processed bundle (see "Generate Installer (DMG)" step below).
      - name: Configure CMake
        working-directory: app
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFINTERM_QT_STRICT=ON \
            -DFINTERM_RELEASE_BUILD=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        working-directory: app
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.logicalcpu)

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        working-directory: app
        run: |
          if [ -f "build/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}"
          elif [ -f "build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          else
            echo "::error::Binary not found"
            find build -maxdepth 3 -name "${{ env.APP_NAME }}*" || true
            exit 1
          fi
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"
          lipo -info "$BINARY"

      # ── Stage .app bundle contents (Python + resources FIRST) ─────────────
      # Order is critical: Python.framework and resources must be in the bundle
      # BEFORE macdeployqt / codesign run. If we embed after signing, dyld on
      # macOS 14+ kills the process with SIGKILL (Code Signature Invalid)
      # because the added framework pages have no signature. See issue #139.
      - name: Stage .app bundle contents
        working-directory: app
        run: |
          set -euxo pipefail
          BUILD_DIR="build"

          if [ -d "${BUILD_DIR}/${{ env.APP_NAME }}.app" ]; then
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
          else
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
            mkdir -p "${APP_BUNDLE}/Contents/MacOS"
            cp "${BUILD_DIR}/${{ env.APP_NAME }}" "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            chmod +x "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            # The version is the project's, as CMake configured it (never a
            # literal that a bump misses).
            FT_VERSION=$(grep -h '^CMAKE_PROJECT_VERSION:' $(find "${GITHUB_WORKSPACE}/app" -maxdepth 3 -name CMakeCache.txt) | head -1 | cut -d= -f2)
            [ -n "${FT_VERSION}" ] || { echo "::error::no CMAKE_PROJECT_VERSION in the CMake cache"; exit 1; }
            cat > "${APP_BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>finterm</string>
            <key>CFBundleIdentifier</key><string>io.github.yumima.finterm</string>
            <key>CFBundleName</key><string>finterm</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${FT_VERSION}</string>
            <key>CFBundleVersion</key><string>${FT_VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>To dictate to the AI chat. finterm listens only while its microphone button is on.</string>
          </dict></plist>
          PLIST
          fi

          # Note: CMake's POST_BUILD rule (CMakeLists.txt line 1907) copies
          # scripts/ to Contents/MacOS/scripts/. This is REQUIRED — at runtime
          # PythonRunner::find_scripts_dir() searches paths relative to
          # applicationDirPath() (which is Contents/MacOS on macOS). Moving
          # scripts to Contents/Resources/ would break script discovery.
          # codesign can handle files in MacOS/; what it CANNOT handle is a
          # malformed framework (see the Python.framework block below).

          # Embed Python framework (before codesign so it gets signed with the bundle).
          # Root cause fixed here (issue #191): codesign --verify rejected the
          # bundle with "embedded framework contains modified or invalid version"
          # because `ditto` left the Versions/Current symlinks inside nested
          # Tcl.framework / Tk.framework broken. We switch to rsync -a (which
          # preserves symlinks as symlinks, unlike ditto under non-root) and
          # then explicitly rebuild Versions/Current + the top-level convenience
          # symlinks for Python.framework AND every nested framework inside it.
          # Version pinned to match the Python runtime the C++ app is built
          # and tested against. setup-python@v6 already provisions 3.12 into
          # ${pythonLocation} and `brew install python@3.12` pours a clean
          # single-version framework under $(brew --prefix python@3.12).
          # Must be kept in sync with the PythonRunner/PythonSetupManager
          # expectations in src/python/.
          PY_VER_KEEP="3.12"

          # Prefer the Homebrew-installed framework: on a fresh pour it holds
          # exactly Versions/${PY_VER_KEEP} + Current, avoiding the multi-
          # version mess that /Library/Frameworks/Python.framework carries on
          # the macos-15-arm64 runner image (3.11/3.12/3.13/3.14 side-by-side).
          # The extra-version pruning below is still done as a safety net.
          PY_FRAMEWORK=""
          for candidate in \
            "$(brew --prefix python@3.12 2>/dev/null)/Frameworks/Python.framework" \
            "/Library/Frameworks/Python.framework" \
            "$(brew --prefix python3 2>/dev/null)/Frameworks/Python.framework"; do
            [ -d "${candidate}/Versions" ] && { PY_FRAMEWORK="${candidate}"; break; }
          done

          BUNDLE_FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          mkdir -p "${BUNDLE_FRAMEWORKS}"

          if [ -z "${PY_FRAMEWORK}" ]; then
            echo "::warning::Python.framework not found — skipping embed step"
          else
            echo "Embedding Python.framework from: ${PY_FRAMEWORK}"
            PYFW="${BUNDLE_FRAMEWORKS}/Python.framework"
            rm -rf "${PYFW}"

            # rsync -a == -rlptgoD; -l preserves symlinks as symlinks. The
            # trailing slash on the source copies contents into the target
            # directory. --safe-links would skip symlinks that point outside
            # the source tree, which we want (dangling nested symlinks are
            # cleaned separately below).
            rsync -a "${PY_FRAMEWORK}/" "${PYFW}/"

            # Strip every Python version except the one we ship. The
            # macos-15-arm64 runner image preinstalls
            # /Library/Frameworks/Python.framework with 3.11, 3.12, 3.13 and
            # 3.14 side-by-side. Leaving more than one version inside the
            # bundled framework trips `codesign --verify --strict` with
            # "embedded framework contains modified or invalid version" —
            # Apple's framework format expects exactly one active version
            # plus Versions/Current. This must run BEFORE
            # fix_framework_symlinks, otherwise Current could point at a
            # version we are about to delete.
            if [ ! -d "${PYFW}/Versions/${PY_VER_KEEP}" ]; then
              echo "::error::Expected Python ${PY_VER_KEEP} under ${PYFW}/Versions/, found:"
              ls -la "${PYFW}/Versions/" || true
              exit 1
            fi
            for v in "${PYFW}/Versions/"*; do
              name="$(basename "$v")"
              [ "$name" = "Current" ] && continue
              [ "$name" = "${PY_VER_KEEP}" ] && continue
              [ -d "$v" ] || continue
              echo "Pruning extra Python version from bundle: ${name}"
              rm -rf "$v"
            done
            PY_VER="${PY_VER_KEEP}"
            echo "Python framework version (kept): ${PY_VER}"

            # Helper: rebuild the framework symlink layer for a framework dir.
            # $1 = path to .framework; $2 = concrete version string inside
            # Versions/. Rebuilds Versions/Current and the top-level name /
            # Resources / Headers symlinks. Uses relative targets so the
            # framework is relocatable.
            fix_framework_symlinks() {
              local fw="$1" ver="$2"
              local fw_name
              fw_name="$(basename "$fw" .framework)"
              [ -d "${fw}/Versions/${ver}" ] || { echo "skip ${fw}: Versions/${ver} missing"; return 0; }
              ( cd "${fw}/Versions" && rm -f Current && ln -s "${ver}" Current )
              for link in "${fw_name}" Resources Headers; do
                local target="Versions/Current/${link}"
                if [ -e "${fw}/${target}" ] || [ -L "${fw}/${target}" ]; then
                  ( cd "${fw}" && rm -f "${link}" && ln -s "${target}" "${link}" )
                fi
              done
            }

            # Fix Python.framework itself
            fix_framework_symlinks "${PYFW}" "${PY_VER}"

            # Fix any nested frameworks inside Python (Tcl, Tk, and anything
            # else Homebrew ships). Codesign walks into these, and a broken
            # symlink layer here is what produced the "modified or invalid
            # version" error on the runner.
            NESTED_ROOT="${PYFW}/Versions/${PY_VER}/Frameworks"
            if [ -d "${NESTED_ROOT}" ]; then
              for nested_fw in "${NESTED_ROOT}"/*.framework; do
                [ -d "${nested_fw}" ] || continue
                nested_ver=""
                if [ -d "${nested_fw}/Versions" ]; then
                  for v in "${nested_fw}/Versions/"*; do
                    name="$(basename "$v")"
                    [ "$name" = "Current" ] && continue
                    [ -d "$v" ] || continue
                    nested_ver="$name"
                    break
                  done
                fi
                [ -n "${nested_ver}" ] || { echo "skip ${nested_fw}: no version dir"; continue; }
                fix_framework_symlinks "${nested_fw}" "${nested_ver}"
              done
            fi

            # Strip dev-only files that shouldn't ship AND confuse codesign:
            #   - .pyc / .pyo caches (regenerated at runtime, stale hashes fail seal)
            #   - __pycache__ directories
            # Run AFTER the symlink fix — otherwise find could race the rebuild.
            find "${PYFW}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${PYFW}" -name "*.pyc" -delete 2>/dev/null || true
            find "${PYFW}" -name "*.pyo" -delete 2>/dev/null || true

            # Remove dangling symlinks (e.g. Homebrew's PrivateHeaders often
            # points to missing targets). `-exec test -e` resolves through
            # symlinks, so a broken link matches `! -exec test -e`.
            find "${PYFW}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true

            # Strip quarantine and extended attributes from the framework.
            # Leftover com.apple.quarantine or com.apple.provenance xattrs on
            # individual pages invalidate the ad-hoc signature when the DMG
            # is copied to /Applications on macOS 14+ Apple Silicon — this is
            # the root cause behind the SIGKILL "Code Signature Invalid"
            # reports in issues #139, #173, #191.
            xattr -cr "${PYFW}" 2>/dev/null || true

            # Convenience symlink the C++ runtime uses to invoke the embedded
            # python binary. Kept from the original block.
            ln -sf "../Frameworks/Python.framework/Versions/${PY_VER}/bin/python${PY_VER}" \
                   "${APP_BUNDLE}/Contents/MacOS/python3" 2>/dev/null || true
            echo "Python ${PY_VER} embedded"

            # Sanity-check every framework that codesign will walk into.
            # Fail fast with a clear error here rather than blowing up 30
            # seconds later inside `codesign --verify`.
            for check_fw in "${PYFW}" "${NESTED_ROOT}"/*.framework; do
              [ -d "${check_fw}" ] || continue
              if [ ! -L "${check_fw}/Versions/Current" ]; then
                echo "::error::${check_fw}/Versions/Current is not a symlink — codesign will reject"
                ls -la "${check_fw}/Versions/" || true
                exit 1
              fi
            done
            echo "Python.framework structure OK"
          fi

          # Resources (icons, requirements-*.txt) go in Contents/Resources/ —
          # macOS convention for non-code assets, read via QStandardPaths.
          # Scripts are ALREADY in Contents/MacOS/scripts/ via CMake POST_BUILD;
          # do not duplicate them into Resources/ (doubles bundle size and
          # creates two trees for codesign to hash).
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp -r resources "${APP_BUNDLE}/Contents/Resources/" 2>/dev/null || true

          echo "Bundle staged at: ${APP_BUNDLE}"
          echo "Pre-sign size: $(du -sh "${APP_BUNDLE}" | cut -f1)"
          echo "=== Contents/MacOS/ top level ==="
          ls -la "${APP_BUNDLE}/Contents/MacOS/" | head -10
          echo "=== Scripts count under MacOS/scripts ==="
          find "${APP_BUNDLE}/Contents/MacOS/scripts" -type f 2>/dev/null | wc -l || true

      # ── Run macdeployqt on the fully staged bundle ────────────────────────
      # macdeployqt copies Qt frameworks, fixes rpaths, and signs everything
      # it touches. It must run AFTER Python.framework + resources are in place
      # so those get correct rpath treatment.
      - name: Run macdeployqt
        working-directory: app
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          MACDEPLOYQT="${QT_ROOT_DIR}/bin/macdeployqt"
          if [ -x "${MACDEPLOYQT}" ]; then
            echo "Running macdeployqt on ${APP_BUNDLE}"
            # -always-overwrite keeps incremental runs idempotent on local
            # re-runs without affecting CI (which always starts clean).
            "${MACDEPLOYQT}" "${APP_BUNDLE}" -verbose=1 -always-overwrite || \
              echo "::warning::macdeployqt exited non-zero — continuing to explicit codesign"
          else
            echo "::error::macdeployqt not found at ${MACDEPLOYQT} — bundle will be missing Qt frameworks"
            exit 1
          fi

          # Belt-and-suspenders: if any linked dylib is still pointing outside
          # the bundle (e.g. @rpath to /Users/runner/work/... or /opt/homebrew),
          # the app will crash on any other machine. Copy every non-system
          # non-bundled dylib into Frameworks/ and rewrite its install name.
          FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          MAIN_BIN="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "${FRAMEWORKS}"

          # Walk every Mach-O inside the bundle. For each, inspect its linked
          # libraries; if any resolve to a path that isn't a system location
          # (/usr/lib, /System) and isn't already inside the bundle, copy it
          # in and rewrite the link with install_name_tool.
          bundle_external_deps() {
            local target="$1"
            otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*|@loader_path/*|@rpath/*) ;;
                "") ;;
                *)
                  if [ -f "$dep" ]; then
                    base=$(basename "$dep")
                    if [ ! -f "${FRAMEWORKS}/${base}" ]; then
                      cp "$dep" "${FRAMEWORKS}/"
                      chmod u+w "${FRAMEWORKS}/${base}"
                      install_name_tool -id "@rpath/${base}" "${FRAMEWORKS}/${base}" 2>/dev/null || true
                      echo "Bundled missing dep: ${base}"
                    fi
                    install_name_tool -change "$dep" "@rpath/${base}" "$target" 2>/dev/null || true
                  fi
                  ;;
              esac
            done
          }

          # Main binary + every dylib in Frameworks
          bundle_external_deps "${MAIN_BIN}"
          find "${FRAMEWORKS}" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
            bundle_external_deps "$dylib"
          done

          # Verify no un-bundled non-system deps remain.
          LEAKS=$(otool -L "${MAIN_BIN}" 2>/dev/null | tail -n +2 | awk '{print $1}' | \
            grep -vE '^(/usr/lib|/System|@executable_path|@loader_path|@rpath)' | \
            grep -v '^$' || true)
          if [ -n "${LEAKS}" ]; then
            echo "::warning::Main binary still references external paths:"
            echo "${LEAKS}"
          else
            echo "Main binary: no external path references"
          fi

          echo "=== Bundle Frameworks/ contents ==="
          ls -la "${FRAMEWORKS}" | head -50

      # ── Deep ad-hoc re-sign the entire bundle ─────────────────────────────
      # This is the fix for issue #139. macdeployqt's signing of nested
      # frameworks is unreliable (known Qt bug — see GDATASoftwareAG fork).
      # We strip every existing signature and re-sign the whole bundle from
      # leaves to root with a single identity (`-` = ad-hoc). On macOS 14+
      # on Apple Silicon this is what prevents dyld from killing the process
      # with SIGKILL Code Signature Invalid at launch.
      #
      # Until Apple Developer ID cert + notarization is added (Tier 2),
      # users will still see "unidentified developer" on first launch and
      # must right-click → Open (or `xattr -d com.apple.quarantine`).
      - name: Deep ad-hoc codesign bundle
        working-directory: app
        run: |
          set -euxo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"

          # Strip extended attributes (quarantine / provenance / Finder info)
          # from the whole bundle. macdeployqt copies Qt frameworks out of the
          # aqtinstall kit, which may carry com.apple.quarantine from the
          # install-qt-action download. Leftover xattrs on individual pages
          # invalidate the signature the moment the DMG is copied to
          # /Applications on macOS 14+ Apple Silicon (root cause of the
          # SIGKILL "Code Signature Invalid" reports in #139, #173, #191).
          echo "Stripping extended attributes from bundle..."
          xattr -cr "${APP_BUNDLE}" 2>/dev/null || true

          echo "Removing existing signatures (leaves first)..."
          # Strip signatures from every Mach-O in the bundle. Must be done
          # leaf-to-root so nested frameworks are unsigned before we re-sign
          # their parents. NOTE: site-packages .so files inside Python.framework
          # ship as 0644 (not exec), so -perm +111 misses them — explicitly
          # catch *.so via the filename predicate. Same for *.dylib nested in
          # frameworks. The `file ... Mach-O` check still gates actual action
          # so text files accidentally named .so (none today, but belt and
          # suspenders) won't trigger spurious codesign calls.
          find "${APP_BUNDLE}" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) 2>/dev/null | \
            while read -r f; do
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                codesign --remove-signature "$f" 2>/dev/null || true
              fi
            done
          codesign --remove-signature "${APP_BUNDLE}" 2>/dev/null || true

          echo "Re-signing bundle ad-hoc (deep)..."
          # Ad-hoc sign ("-"): do NOT pass --preserve-metadata — the bundle has
          # no prior entitlements/requirements to preserve, and the flag will
          # fail with "resource fork, Finder information, or similar detritus
          # not allowed" on fresh macdeployqt output. Entitlements are only
          # needed with a real Developer ID cert + hardened runtime (Tier 2).
          codesign --force --deep --sign - \
                   --timestamp=none \
                   "${APP_BUNDLE}"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}" || {
            echo "::error::Bundle verification failed"
            codesign --display --deep --verbose=4 "${APP_BUNDLE}" || true
            exit 1
          }

          echo "Signature OK:"
          codesign --display --verbose=2 "${APP_BUNDLE}" 2>&1 | head -20

      # Dictation: macOS ends an app that opens the microphone without saying
      # why, and Qt answers "denied" when its permission plugin is not linked.
      - name: Check the microphone's permission is in the bundle
        working-directory: app
        run: |
          set -euo pipefail
          B="build/${{ env.APP_NAME }}.app"
          plutil -extract NSMicrophoneUsageDescription raw "$B/Contents/Info.plist"
          # grep without -q: it would close the pipe early and fail the step.
          strings -a "$B/Contents/MacOS/finterm" | grep "DarwinMicrophonePermission" >/dev/null \
            || { echo "::error::Qt's microphone permission plugin is not linked"; exit 1; }

      # ── Copy signed bundle to dist/ ───────────────────────────────────────
      - name: Finalize dist
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "build/${{ env.APP_NAME }}.app" "dist/"
          echo "Final bundle size: $(du -sh "dist/${{ env.APP_NAME }}.app" | cut -f1)"

      # ── Generate Installer (DMG via hdiutil) ──────────────────────────────
      # We intentionally skip CPack IFW on macOS: CPack's install(TARGETS ...
      # BUNDLE) rule packages the raw build-tree .app, NOT the post-processed
      # one we just ran macdeployqt + deep codesign over. Shipping the raw
      # bundle produces the dyld SIGKILL "Code Signature Invalid" crash
      # tracked in issue #139. A plain hdiutil DMG over `dist/` (which
      # contains the signed bundle) gives users a working drag-to-Apps DMG.
      - name: Generate Installer (DMG)
        working-directory: app
        run: |
          set -euo pipefail
          # Parse project() VERSION so the DMG filename matches the regex in
          # update-manifest: finterm-<version>-macos-arm64-setup.dmg
          VERSION=$(grep -Eo 'project\(finterm VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          [ -n "${VERSION}" ] || { echo "::error::Could not parse VERSION from CMakeLists.txt"; exit 1; }
          DMG_NAME="finterm-${VERSION}-macos-arm64-setup.dmg"
          echo "DMG target: ${DMG_NAME}"

          STAGING="$(mktemp -d)/dmg_staging"
          mkdir -p "${STAGING}"
          cp -R "dist/${{ env.APP_NAME }}.app" "${STAGING}/"
          # Symlink /Applications so users can drag the app across in the DMG.
          ln -s /Applications "${STAGING}/Applications"

          hdiutil create \
            -volname "${{ env.APP_NAME }}" \
            -srcfolder "${STAGING}" \
            -ov -format UDZO \
            "build/${DMG_NAME}"

          ls -lh "build/${DMG_NAME}"

      # ── Install it and prove it gets data ─────────────────────────────────
      # The same check as the Windows job, on what a Mac user does: open the
      # disk image, copy the app out, start it. See SelfTest.h.
      - name: Self-test the app from the disk image (Python setup, data daemon, one quote)
        timeout-minutes: 50
        working-directory: app
        run: |
          set -uo pipefail
          DMG="$(ls build/finterm-*-macos-arm64-setup.dmg | head -1)"
          MNT="${RUNNER_TEMP}/finterm-dmg"
          DEST="${RUNNER_TEMP}/finterm-install"
          REPORT="${RUNNER_TEMP}/selftest.json"
          rm -rf "${DEST}" "${REPORT}"; mkdir -p "${MNT}" "${DEST}"
          hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${MNT}"
          cp -R "${MNT}/${{ env.APP_NAME }}.app" "${DEST}/"
          hdiutil detach "${MNT}" || true
          EXE="${DEST}/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          [ -x "${EXE}" ] || { echo "::error::the disk image has no runnable app"; ls -R "${DEST}" | head -40; exit 1; }
          CODE=0   # the shell runs with -e: a failure must not end the step unreported
          "${EXE}" --profile selftest --selftest "${REPORT}" || CODE=$?
          echo "exit code: ${CODE}"
          cat "${REPORT}" 2>/dev/null || echo "(no report written)"
          if [ "${CODE}" -ne 0 ] || ! grep -q '"ok": true' "${REPORT}" 2>/dev/null; then
            find "${HOME}/Library/Application Support" "${HOME}/.local/share" -name 'finterm.log' 2>/dev/null \
              | while read -r f; do echo "--- $f"; tail -n 150 "$f"; done
            echo "::error::the installed app failed its self-test: $(jq -r '.stage + ": " + .detail' "${REPORT}" 2>/dev/null || echo "no report")"
            exit 1
          fi

      # ── In-place update: the helper the app runs, on the real disk image ──
      # apply-update.sh (embedded in the app) opens the DMG, copies the bundle
      # beside the installed one, swaps them and keeps the previous; then a
      # rollback. The same DMG stands in for the next version.
      - name: In-place update and rollback (apply-update.sh, macapp)
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          # A copy: the helper deletes the disk image it consumes, and this one
          # is the release asset uploaded below.
          cp "$(ls build/finterm-*-macos-arm64-setup.dmg | head -1)" "${RUNNER_TEMP}/update-test.dmg"
          DMG="${RUNNER_TEMP}/update-test.dmg"
          DEST="${RUNNER_TEMP}/finterm-update-test"
          STATUS="${RUNNER_TEMP}/update-status.json"
          rm -rf "${DEST}"; mkdir -p "${DEST}/finterm.app/Contents/MacOS"
          echo old > "${DEST}/finterm.app/Contents/MacOS/marker-old"
          sh src/services/updater/scripts/apply-update.sh --kind macapp --staged "${DMG}" \
              --target "${DEST}/finterm.app" --previous "${DEST}/.finterm-previous.app" \
              --status "${STATUS}" --from 0.0.1 --to 0.0.2
          cat "${STATUS}"
          grep -q '"ok":true' "${STATUS}" || { echo "::error::macapp update failed"; exit 1; }
          [ -x "${DEST}/finterm.app/Contents/MacOS/${{ env.APP_NAME }}" ] || { echo "::error::no app after the update"; exit 1; }
          [ ! -e "${DEST}/finterm.app/Contents/MacOS/marker-old" ] || { echo "::error::old bundle not replaced"; exit 1; }
          [ -e "${DEST}/.finterm-previous.app/Contents/MacOS/marker-old" ] || { echo "::error::previous not kept"; exit 1; }
          codesign --verify --deep --strict "${DEST}/finterm.app" || { echo "::error::the swapped bundle fails codesign"; exit 1; }
          sh src/services/updater/scripts/apply-update.sh --kind macapp-rollback \
              --target "${DEST}/finterm.app" --previous "${DEST}/.finterm-previous.app" \
              --status "${STATUS}" --from 0.0.2 --to 0.0.1
          cat "${STATUS}"
          grep -q '"ok":true' "${STATUS}" || { echo "::error::macapp rollback failed"; exit 1; }
          [ -e "${DEST}/finterm.app/Contents/MacOS/marker-old" ] || { echo "::error::rollback did not restore"; exit 1; }
          ls build/finterm-*-macos-arm64-setup.dmg >/dev/null || { echo "::error::the release DMG is gone"; exit 1; }
          echo "in-place update + rollback OK"

      # ── The app installs itself from the disk image ───────────────────────
      # What a user's first start from the DMG offers, by its command-line
      # form: copied to /Applications (or ~/Applications), updated in place
      # with the previous kept, a Dock tile on the first install, and
      # --uninstall removing what it added.
      - name: Install, update and uninstall (from the disk image)
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          DMG="$(ls build/finterm-*-macos-arm64-setup.dmg | head -1)"
          MNT="${RUNNER_TEMP}/finterm-install-dmg"; mkdir -p "${MNT}"
          hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${MNT}"
          trap 'hdiutil detach "${MNT}" -quiet || true' EXIT
          FROM="${MNT}/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          fin() { QT_QPA_PLATFORM=offscreen "$@"; }
          # First (the Dock tile is offered on the first install only): the
          # tile, and the uninstall taking it away.
          if defaults read com.apple.dock persistent-apps >/dev/null 2>&1; then
            OUT="$(fin "${FROM}" --install)"; echo "${OUT}"
            echo "${OUT}" | jq -e '.ok == true and (.done | any(test("added to the Dock")))' >/dev/null
            APP="$(echo "${OUT}" | jq -r .installed)"
            DOCK="$(defaults read com.apple.dock persistent-apps)"
            echo "${DOCK}" | grep -F "${APP}" >/dev/null
            OUT="$(fin "${APP}/Contents/MacOS/${{ env.APP_NAME }}" --uninstall)"; echo "${OUT}"
            echo "${OUT}" | jq -e '.ok == true and (.done | any(test("removed from the Dock")))' >/dev/null
            DOCK="$(defaults read com.apple.dock persistent-apps)"
            if echo "${DOCK}" | grep -F "${APP}" >/dev/null; then
              echo "::error::the Dock tile was not removed"; exit 1
            fi
          else
            echo "::warning::no Dock preferences on this runner - the Dock tile is not checked"
          fi
          OUT="$(fin "${FROM}" --install --no-favourite)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true' >/dev/null
          APP="$(echo "${OUT}" | jq -r .installed)"
          case "${APP}" in /Applications/finterm.app|"${HOME}/Applications/finterm.app") ;; *) echo "::error::installed to ${APP}"; exit 1 ;; esac
          codesign --verify --deep --strict "${APP}"
          [ -z "$(xattr -p com.apple.quarantine "${APP}" 2>/dev/null || true)" ]
          # Again (the same version): put in place again, no "previous" made of it.
          OUT="$(fin "${FROM}" --install --no-favourite)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true and (.done | any(test("installed:")))' >/dev/null
          [ ! -e "$(dirname "${APP}")/.finterm-previous.app" ] && [ ! -e "$(dirname "${APP}")/.finterm-replaced.app" ]
          codesign --verify --deep --strict "${APP}"
          OUT="$(fin "${APP}/Contents/MacOS/${{ env.APP_NAME }}" --install)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true and (.done | any(test("already running from")))' >/dev/null
          OUT="$(fin "${APP}/Contents/MacOS/${{ env.APP_NAME }}" --uninstall)"; echo "${OUT}"
          echo "${OUT}" | jq -e '.ok == true' >/dev/null
          [ ! -e "${APP}" ] && [ ! -e "$(dirname "${APP}")/.finterm-previous.app" ]
          echo "install + update + uninstall OK"

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finterm-macOS-arm64-installer
          path: app/build/finterm-*-macos-arm64-setup.dmg
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 4 — Create GitHub Release and attach all installers
#          Only runs on tag push after all builds succeed
# ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [tests, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.tests.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    outputs:
      # Pass the tag so update-readme can use it
      tag: ${{ github.ref_name }}
      replaced: ${{ steps.replaced.outputs.counts }}
      replaced_key: ${{ steps.replaced.outputs.key }}

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: finterm-Windows-x64-installer
          path: dist/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: finterm-Linux-x64-installer
          path: dist/linux

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: finterm-macOS-arm64-installer
          path: dist/macos

      - name: List release assets
        run: find dist -type f | sort

      # A version released again replaces its files, and their download counts
      # with them: kept for the site's counter.
      - name: Download counts of what is replaced
        id: replaced
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > was.json 2>/dev/null; then
            c=$(jq -c '.assets as $a | def n($e): [$a[] | select(.name | endswith("-setup." + $e)) | .download_count] | add // 0;
                       {linux: n("run"), windows: n("exe"), macos: n("dmg")}' was.json)
          fi
          rm -f was.json
          echo "counts=${c}" >> "${GITHUB_OUTPUT}"
          # Named here: this job runs once per replacement, the one that keeps it may run again.
          echo "key=${GITHUB_REF_NAME}@${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "finterm ${{ github.ref_name }}"
          body: |
            ## finterm ${{ github.ref_name }}

            Native C++20 financial intelligence terminal — Qt6, embedded Python analytics, 50+ screens.

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows x64** | `finterm-*-setup.exe` | Run the installer → `finterm.exe` |
            | **Linux x64** | `finterm-*-linux-x64-setup.run` | `chmod +x` and run it, then **Install** (to `~/Applications`, with a menu entry) |
            | **macOS Apple Silicon** | `finterm-*.dmg` | Open it, start finterm, then **Install** (to Applications, with a Dock tile) |

            These builds are free and **not code-signed by a paid certificate**, so the
            first launch needs one extra click:
            - **Windows** — SmartScreen says "Windows protected your PC": *More info* → *Run anyway*.
            - **macOS** — "cannot be opened because the developer cannot be verified":
              right-click the app → *Open* → *Open* (once), or System Settings → Privacy & Security → *Open Anyway*.
            - **Linux** — without FUSE it still runs, unpacking itself each start; to fix that on Ubuntu: `sudo apt install libfuse2 fuse3`
              (or run with `--appimage-extract-and-run`).

            The first start sets up finterm's Python environment (5–15 minutes, once).

            **Already installed?** Run the new download the same way: it offers to update
            the installed finterm and keeps your data (backed up first when its format
            changes). On Windows an old copy in Program Files is replaced too.

            ### Requirements
            - Windows 10/11 x64
            - Ubuntu 22.04+ / Debian 12+ / Fedora 38+ (x86-64)
            - macOS 13+ (Apple Silicon)

            See the [README](https://github.com/yumima/finterm#install) for details.
          files: |
            dist/windows/**
            dist/linux/**
            dist/macos/**
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

# ═════════════════════════════════════════════════════════════════════════════
# JOB 5 — Update repo metadata on main (README download links + updates.json)
#
# Previously split into two jobs that both ran `needs: release` and both
# pushed to main — they raced and the loser died with
# `! [rejected] main -> main (fetch first)`. Worse, when the loser was the
# updates.json push, the in-app auto-updater (UpdateService.cpp fetches
# raw.githubusercontent.com/.../main/updates.json) would never see the new
# version, silently breaking updates for every existing install.
#
# Merged into ONE job with ONE checkout, ONE commit (containing both file
# changes), and ONE push. No race possible. No retries needed.
#
# Outputs:
#  - README.md: download table rewritten with current release asset URLs
#  - updates.json: manifest consumed by UpdateService.cpp; platform keys must
#    match UpdateService::current_platform_key()
#    (windows-x64 / windows-arm64 / linux-x64 / macos-arm64 / macos-x64).
#    Asset filenames must match CPACK_PACKAGE_FILE_NAME in CMakeLists.txt:
#    finterm-<version>-<platform>-<arch>-setup.<ext>
# ═════════════════════════════════════════════════════════════════════════════
  update-repo-metadata:
    name: Update README + updates.json on main
    needs: release
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write   # to start the Website deploy (a bot push triggers no workflow)

    steps:
      - name: Checkout repository (main branch, full history)
        uses: actions/checkout@v4
        with:
          # Write-scoped token so we can push the merged commit back.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Checkout main (not the tag) because we commit on top of main.
          ref: main
          # fetch-depth: 0 gives us full history. Needed so a future
          # `git pull --rebase` (only used if a human race-pushes to main
          # during the workflow — vanishingly rare but cheap insurance)
          # has the base commits available.
          fetch-depth: 0

      # ── Wait for the release to be fully published ────────────────────────
      # GitHub's release-creation step in the previous job returns as soon as
      # the release row exists, but the asset rows can take a few seconds to
      # propagate to the API. Poll for visibility once here; both downstream
      # steps (URL fetch + asset download) share this readiness gate instead
      # of each polling separately.
      - name: Wait for release to be visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            ASSET_COUNT=$(gh release view "${TAG}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
            echo "  attempt ${i}: ${ASSET_COUNT} asset(s) visible"
            [ "${ASSET_COUNT}" -ge 1 ] && exit 0
            sleep 5
          done
          echo "::error::Release ${TAG} still has no visible assets after 60s"
          exit 1

      # ── Fetch release asset URLs via gh CLI ───────────────────────────────
      # gh is pre-installed on all GitHub-hosted runners.
      - name: Fetch release asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Fetching asset URLs for release ${TAG}..."

          # Extract URLs for each platform (first match per pattern)
          WIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("(?i)windows.*\\.exe$|setup.*\\.exe$")) | .url' \
            | head -1)
          LIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.run$|linux.*setup")) | .url' \
            | head -1)
          MAC_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.dmg$|macos.*setup")) | .url' \
            | head -1)

          # Fallback: if browser_download_url not available via .url, try .browserDownloadUrl
          [ -z "$WIN_URL" ] && WIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("(?i)windows.*\\.exe$|setup.*\\.exe$")) | .browserDownloadUrl' \
            | head -1) || true
          [ -z "$LIN_URL" ] && LIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.run$|linux.*setup")) | .browserDownloadUrl' \
            | head -1) || true
          [ -z "$MAC_URL" ] && MAC_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.dmg$|macos.*setup")) | .browserDownloadUrl' \
            | head -1) || true

          # Release page URL as final fallback
          RELEASE_URL="https://github.com/yumima/finterm/releases/tag/${TAG}"
          WIN_URL="${WIN_URL:-${RELEASE_URL}}"
          LIN_URL="${LIN_URL:-${RELEASE_URL}}"
          MAC_URL="${MAC_URL:-${RELEASE_URL}}"

          echo "WIN_URL=${WIN_URL}" >> "$GITHUB_ENV"
          echo "LIN_URL=${LIN_URL}" >> "$GITHUB_ENV"
          echo "MAC_URL=${MAC_URL}" >> "$GITHUB_ENV"
          echo "RELEASE_URL=${RELEASE_URL}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

          echo "Windows  : ${WIN_URL}"
          echo "Linux    : ${LIN_URL}"
          echo "macOS    : ${MAC_URL}"

      # ── Rewrite README download table ─────────────────────────────────────
      # Strategy: replace a clearly-delimited block between two sentinel
      # comments. Robust — no regex on links needed.
      - name: Update README download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          START_MARKER="<!-- DOWNLOAD-TABLE-START -->"
          END_MARKER="<!-- DOWNLOAD-TABLE-END -->"

          # Same three rows as the hand-written table in README.md, with
          # this release's direct links in place of the file-name patterns.
          NEW_BLOCK="${START_MARKER}
          | System | Download | First launch |
          |---|---|---|
          | **Linux** x86-64 | [AppImage (.run)](${LIN_URL}) | \`chmod +x finterm-*.run && ./finterm-*.run\`, then **Install** |
          | **Windows** 10/11 x64 | [Installer (.exe)](${WIN_URL}) | Run it. At SmartScreen: **More info → Run anyway** |
          | **macOS** 13+ Apple Silicon | [Disk image (.dmg)](${MAC_URL}) | Open it, **right-click finterm → Open → Open**, then **Install** |

          Current release: [${TAG}](${RELEASE_URL}) · [all releases](https://github.com/yumima/finterm/releases)
          ${END_MARKER}"

          README="README.md"

          # Delegate regex replacement to a standalone Python script so
          # YAML indentation can't poison the Python source.
          export README NEW_BLOCK
          python3 .github/scripts/update_readme_table.py

          echo "=== README diff preview (first 60 lines) ==="
          git diff README.md | head -60 || true

      # The build's own files, not the release's: fetching those would count as
      # downloads. They are compared with the release's hashes below.
      - name: Download the built assets
        uses: actions/download-artifact@v4
        with:
          pattern: finterm-*-installer
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      # ── Regenerate updates.json (auto-updater manifest) ───────────────────
      - name: Regenerate updates.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Strip leading 'v' so "v4.0.2" → "4.0.2" for latest-version
          VERSION="${TAG#v}"

          WORK="${RUNNER_TEMP}/assets"
          gh api "repos/${REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' > "${RUNNER_TEMP}/SHA256SUMS"
          (cd "${WORK}" && sha256sum finterm-*) > "${RUNNER_TEMP}/built"
          if other=$(grep -vxFf "${RUNNER_TEMP}/SHA256SUMS" "${RUNNER_TEMP}/built"); then
            echo "::error::not what the release has: ${other}"
            exit 1
          fi

          # What the assets were built from (GITHUB_SHA: the tag's commit).
          COMMIT="${GITHUB_SHA}"
          COMMITTED=$(gh api "repos/${REPO}/commits/${COMMIT}" --jq .commit.committer.date)
          [ -n "${COMMITTED}" ] || { echo "::error::no date for commit ${COMMIT}"; exit 1; }

          # Export shell-side vars so the embedded python can read them via os.environ
          export WORK VERSION TAG REPO COMMIT COMMITTED

          # Delegate manifest generation to a standalone Python script to
          # keep this step free of YAML/Python indentation conflicts.
          python3 .github/scripts/generate_updates_manifest.py > updates.json

          echo "=== updates.json diff ==="
          git diff updates.json | head -80 || true

      # ── Website download page (site/download.md reads this) ───────────────
      - name: Write site/_data/release.json
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A URL that fell back to the release page is not a download.
          for u in "${WIN_URL}" "${LIN_URL}" "${MAC_URL}"; do
            case "$u" in */releases/download/*) ;; *) echo "::warning::no direct asset URL; site keeps its old links"; exit 0 ;; esac
          done
          # When the files went up, not when the release was first published: a
          # release replaced under the same version keeps its publication time,
          # and this is what tells the new files from the old.
          released=$(gh release view "${TAG}" --json assets --jq '[.assets[].updatedAt] | max // empty')
          if [ -z "${released}" ]; then
            echo "::error::release ${TAG} lists no files"
            exit 1
          fi
          jq -n --arg version "${TAG#v}" --arg released "${released}" --arg build "${GITHUB_SHA:0:7}" --arg page "${RELEASE_URL}" \
                --arg linux "${LIN_URL}" --arg windows "${WIN_URL}" --arg macos "${MAC_URL}" \
                '{version:$version, released:$released, build:$build, page:$page, linux:$linux, windows:$windows, macos:$macos}' \
                > site/_data/release.json
          cat site/_data/release.json

      # ── Single atomic commit + push ───────────────────────────────────────
      # Both files in one commit → one push → no race with anything. If
      # neither file changed (rare but possible, e.g. re-running the same
      # tag), exit cleanly without an empty commit.
      - name: Commit and push repo metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          README_CHANGED=0
          MANIFEST_CHANGED=0
          SITE_CHANGED=0
          git diff --quiet README.md    || README_CHANGED=1
          git diff --quiet updates.json || MANIFEST_CHANGED=1
          # May be a brand-new file, which `git diff` does not see.
          [ -z "$(git status --porcelain -- site/_data/release.json)" ] || SITE_CHANGED=1

          if [ "${README_CHANGED}" -eq 0 ] && [ "${MANIFEST_CHANGED}" -eq 0 ] && [ "${SITE_CHANGED}" -eq 0 ]; then
            echo "Nothing changed — nothing to commit"
            exit 0
          fi

          # Stage only what we own. Never `git add -A` in automation: a
          # stray artefact from an earlier step would sneak into main.
          [ "${README_CHANGED}"   -eq 1 ] && git add README.md
          [ "${MANIFEST_CHANGED}" -eq 1 ] && git add updates.json
          [ "${SITE_CHANGED}"     -eq 1 ] && git add site/_data/release.json

          git commit -m "chore(release): update README download links and updates.json for ${TAG}

          Auto-generated by release workflow after successful build:
            * README.md: download table rewritten with ${TAG} asset URLs
            * updates.json: manifest consumed by the in-app auto-updater
              (UpdateService.cpp) — sha256 computed from release assets.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Defensive: if a human raced us and pushed to main during this
          # workflow, rebase once and retry. We do NOT race any sibling job
          # here (there are none), so this should almost never fire.
          if ! git push origin main; then
            echo "::warning::push rejected (likely external push to main); rebasing once..."
            git pull --rebase origin main
            git push origin main
          fi
          echo "Repo metadata pushed to main"

      # What the purge deletes takes its download counts with it. Nothing depends
      # on these: a failure here holds nothing up. Before the redeploy, which shows them.
      - name: Keep the download counts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPLACED: ${{ needs.release.outputs.replaced }}
          REPLACED_KEY: ${{ needs.release.outputs.replaced_key }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[]' | jq -s . > /tmp/releases.json
          python3 .github/scripts/keep_download_counts.py site/_data/downloads.json /tmp/releases.json "${TAG}" \
            "${REPLACED:-null}" "${REPLACED_KEY}"
          git diff --quiet site/_data/downloads.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/_data/downloads.json
          git commit -q -m "chore(release): download counts of the releases before ${TAG}"
          git push origin main || { git pull --rebase origin main && git push origin main; }

      # A push made with GITHUB_TOKEN starts no workflow, so the site would
      # keep the previous release's links: start its deploy explicitly, and wait
      # for it. The purge below deletes the files those links point at, so it
      # runs only once the site is out (4.1.0's deploy failed, the purge went
      # ahead, and every download button was a 404). If this fails: re-run the
      # failed job.
      - name: Redeploy the website
        timeout-minutes: 110
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          site=$(git show HEAD:site/_data/release.json | jq -r .version)
          if [ "${site}" != "${TAG#v}" ]; then
            echo "::error::the website's data names ${site}, not ${TAG#v}; the previous release is kept"
            exit 1
          fi
          for attempt in 1 2; do
            since=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)
            id=$(gh workflow run website.yml --ref main | grep -oE '[0-9]+$' | tail -1) || id=""
            # The start may name no run: then it is the one begun since.
            for i in $(seq 1 12); do
              [ -z "${id}" ] || break
              sleep 5
              id=$(gh run list --workflow website.yml --event workflow_dispatch --created ">=${since}" \
                     --limit 1 --json databaseId --jq '.[0].databaseId // empty') || id=""
            done
            state="not started"
            # One run at a time, to its end (40 min covers both its jobs and a
            # queue): a second one started meanwhile would only wait behind it.
            for i in $(seq 1 240); do
              [ -n "${id}" ] || break
              state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '.status + " " + (.conclusion // "")') || state="unknown"
              case "${state}" in completed*) break ;; esac
              sleep 10
            done
            echo "attempt ${attempt}: website run ${id:-?}: ${state}"
            [ "${state}" = "completed success" ] && exit 0
            sleep 15
          done
          echo "::error::the website did not deploy; the previous release is kept"
          exit 1

      # Policy: one release on GitHub — the current one. After this release
      # and its metadata are out, delete every release published BEFORE it,
      # assets included (~300 MB each). Git tags stay, so any version can be
      # rebuilt. Only older ones: re-running an old tag never deletes a newer
      # release. Last on purpose — a failure above leaves the previous release
      # (still what README/updates.json point at) in place.
      - name: Purge previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .published_at)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name != \"${TAG}\" and .published_at != null and .published_at < \"${current}\") | .tag_name" |
          while read -r old; do
            gh release delete "${old}" --repo "${GITHUB_REPOSITORY}" --yes
            echo "Deleted release ${old} (tag kept)"
          done
